syntax = "proto3";

package argus.notification.v1;

option cc_enable_arenas = true;

// (createdAt, id) cursor window; any subset present narrows the pull.
message SyncRange {
  optional int64 start_time = 1;
  optional int64 start_id = 2;
  optional int64 end_time = 3;
}

// Notification row as the notification sync table serves it.
message NotificationRow {
  int64 id = 1;
  int64 user_id = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  string data = 6; // serialized JSON payload
  bool is_read = 7;
  optional int64 read_at = 8;
  int64 created_at = 9;
}

// One fan-out create: the server writes one row per user id.
message CreateNotificationsRequest {
  repeated int64 user_ids = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  string data = 5; // serialized JSON payload
  // Sender idempotency key; the receiver drops a repeated batch.
  string command_id = 6;
}

message CreateNotificationsResponse {
  int32 created = 1;
  // True when the command was already committed; created repeats the
  // original persisted batch size.
  bool duplicate = 2;
}

// Pull of one user's notification rows; only the created leg is serverable.
message NotificationPull {
  bool required_create = 1;
  bool find_last_created = 2;
  optional SyncRange created = 3;
}

message PullNotificationsRequest {
  NotificationPull notification = 1;
}

message PullNotificationsResponse {
  repeated NotificationRow created = 1;
  optional NotificationRow last_created = 2;
}

// Notification-domain RPCs served by argus-notification; the caller identity
// rides the x-argus-user / x-argus-role / x-argus-device metadata.
service NotificationService {
  rpc CreateNotifications(CreateNotificationsRequest)
      returns (CreateNotificationsResponse) {}

  rpc PullNotifications(PullNotificationsRequest)
      returns (PullNotificationsResponse) {}
}
