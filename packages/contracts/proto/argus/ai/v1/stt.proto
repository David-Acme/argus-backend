syntax = "proto3";

package argus.ai.v1;

import "argus/common/v1/base.proto";

option cc_enable_arenas = true;

service SttService {
  rpc Transcribe(TranscribeRequest) returns (argus.common.v1.Envelope);
}

message TranscribeRequest {
  bytes audio = 1;
  string lang = 2;
}

message TranscribeResponse {
  string text = 1;
}
