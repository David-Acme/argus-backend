syntax = "proto3";

package argus.ai.v1;

import "argus/common/v1/base.proto";

option cc_enable_arenas = true;

message ChatMessage {
  string role = 1; // system | user | assistant
  string content = 2;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  float temperature = 2;
  int32 max_tokens = 3;
}

// Mirrors LlmService::chat / chatAsync.
service LlmService {
  rpc Chat(ChatRequest) returns (argus.common.v1.Envelope);
  rpc ChatStream(ChatRequest) returns (stream ChatChunk);
}

message ChatChunk {
  string token = 1;
  bool done = 2;
}