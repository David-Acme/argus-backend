syntax = "proto3";

package argus.ai.v1;

option cc_enable_arenas = true;

service TtsService {
  rpc Synthesize(TtsRequest) returns (stream TtsChunk);
}

message TtsRequest {
  string text = 1;
  string voice_id = 2;
  string lang = 3;
  uint32 sample_rate = 4;
}

message TtsChunk {
  bytes pcm_int16 = 1;
  bool done = 2;
}
