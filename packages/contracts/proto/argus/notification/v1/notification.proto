syntax = "proto3";

package argus.notification.v1;

option cc_enable_arenas = true;

message SyncRange {
  optional int64 start_time = 1;
  optional int64 start_id = 2;
  optional int64 end_time = 3;
}

message NotificationRow {
  int64 id = 1;
  int64 user_id = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  string data = 6;
  bool is_read = 7;
  optional int64 read_at = 8;
  int64 created_at = 9;
}

message CreateNotificationsRequest {
  repeated int64 user_ids = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  string data = 5;
  string command_id = 6;
}

message CreateNotificationsResponse {
  int32 created = 1;
  bool duplicate = 2;
}

message NotificationPull {
  bool required_create = 1;
  bool find_last_created = 2;
  optional SyncRange created = 3;
}

message PullNotificationsRequest {
  NotificationPull notification = 1;
}

message PullNotificationsResponse {
  repeated NotificationRow created = 1;
  optional NotificationRow last_created = 2;
}

enum CallClaimStatus {
  CALL_CLAIM_STATUS_UNSPECIFIED = 0;
  CALL_CLAIM_STATUS_CLAIMED = 1;
  CALL_CLAIM_STATUS_TAKEN = 2;
  CALL_CLAIM_STATUS_EXPIRED = 3;
  CALL_CLAIM_STATUS_NOT_FOUND = 4;
}

enum CallOutcome {
  CALL_OUTCOME_UNSPECIFIED = 0;
  CALL_OUTCOME_COMPLETED = 1;
  CALL_OUTCOME_DECLINED = 2;
  CALL_OUTCOME_FAILED = 3;
}

message ClaimCallRequest {
  string call_id = 1;
  int64 user_id = 2;
  string session_id = 3;
}

message ClaimCallResponse {
  CallClaimStatus status = 1;
  string opening_line = 2;
  string lang = 3;
  string kind = 4;
  string summary = 5;
  string title = 6;
  int64 camera_id = 7;
  string camera_name = 8;
  int64 episode_id = 9;
  string environment_name = 10;
  string urgency = 11;
}

message EndCallRequest {
  string call_id = 1;
  int64 user_id = 2;
  CallOutcome outcome = 3;
  bool spoken = 4;
}

message EndCallResponse {
  bool ok = 1;
}

message ScheduleCallRequest {
  int64 user_id = 1;
  int64 fire_at = 2;
  string topic = 3;
  string lang = 4;
  string command_id = 5;
}

message ScheduleCallResponse {
  int64 scheduled_id = 1;
  bool duplicate = 2;
}

message AnnounceAgendaRequest {
  repeated int64 user_ids = 1;
  int32 lead_minutes = 2;
  string title = 3;
  string body = 4;
  string data = 5;
  string command_id = 6;
}

message AnnounceAgendaResponse {
  int32 notified = 1;
  int32 rang = 2;
}

service CallService {
  rpc ClaimCall(ClaimCallRequest) returns (ClaimCallResponse) {}

  rpc EndCall(EndCallRequest) returns (EndCallResponse) {}

  rpc ScheduleCall(ScheduleCallRequest) returns (ScheduleCallResponse) {}

  rpc AnnounceAgenda(AnnounceAgendaRequest) returns (AnnounceAgendaResponse) {}
}

service NotificationService {
  rpc CreateNotifications(CreateNotificationsRequest)
      returns (CreateNotificationsResponse) {}

  rpc PullNotifications(PullNotificationsRequest)
      returns (PullNotificationsResponse) {}
}
