syntax = "proto3";

package argus.common.v1;

option cc_enable_arenas = true;

// Frozen error codes mirroring the HTTP envelope codes (AppConfig::ERROR_CODE_*).
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_REQUEST = 1;
  ERROR_CODE_VALIDATION_ERROR = 2;
  ERROR_CODE_UNAUTHORIZED = 3;
  ERROR_CODE_FORBIDDEN = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_METHOD_NOT_ALLOWED = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_SERVICE_UNAVAILABLE = 8;
  ERROR_CODE_TOO_MANY_REQUESTS = 9;
  ERROR_CODE_INTERNAL_ERROR = 10;
  ERROR_CODE_CAMERA_UNREACHABLE = 11;
}

// Always-present response envelope; info and errors stay empty when absent.
message Envelope {
  int32 status = 1;
  string info = 2;
  Errors errors = 3;
}

message Errors {
  repeated Error items = 1;
}

message Error {
  string code = 1;
  string message = 2;
  string field = 3; // set on VALIDATION_ERROR only
}

// Caller identity forwarded by the gateway as metadata headers.
message RequestContext {
  string x_argus_user = 1;   // header x-argus-user
  string x_argus_role = 2;   // header x-argus-role
  string x_argus_device = 3; // header x-argus-device
}