syntax = "proto3";

package argus.voice.v1;

enum VoiceLanguage {
  VOICE_LANGUAGE_SYSTEM = 0;
  VOICE_LANGUAGE_ES = 1;
  VOICE_LANGUAGE_EN = 2;
}

enum VoiceRole
{
  VOICE_ROLE_OWNER = 0;
  VOICE_ROLE_RESIDENT = 1;
  VOICE_ROLE_GUARD = 2;
  VOICE_ROLE_GUEST = 3;
  VOICE_ROLE_UNKNOWN = 4;
}

message VoiceIdentity
{
  int64 user_id = 1;
  string name = 2;
  VoiceLanguage language = 3;
  optional VoiceRole role = 4;
  string device_hash = 5;
}

enum VoiceMode
{
  VOICE_MODE_HALF_DUPLEX = 0;
  VOICE_MODE_DUPLEX = 1;
}

message VoiceStart
{
  VoiceIdentity identity = 1;
  VoiceMode mode = 2;
  bool resume = 3;
  string opening_line = 4;
}

message VoiceStop {}

message VoiceSkip {}

enum VoiceContextKind
{
  VOICE_CONTEXT_NOTE = 0;
  VOICE_CONTEXT_CAMERA_EVENT = 1;
  VOICE_CONTEXT_SITUATION = 2;
}

message VoiceContext
{
  VoiceContextKind kind = 1;
  string text = 2;
  string camera = 3;
}

message VoiceActionResult
{
  int64 id = 1;
  bool ok = 2;
  string detail = 3;
}

message VoiceMute
{
  bool muted = 1;
}

message VoiceFarewell
{
  string reason = 1;
}

message ClientFrame
{
  oneof body
  {
    VoiceStart start = 1;
    VoiceStop stop = 2;
    VoiceSkip skip = 3;
    bytes pcm = 4;
    VoiceContext context = 5;
    VoiceActionResult action_result = 6;
    VoiceMute mute = 7;
    VoiceFarewell farewell = 8;
  }
}

message VoiceStt
{
  string text = 1;
  bool final = 2;
}

message VoiceAssistant
{
  string text = 1;
  int64 turn_id = 2;
}

message VoiceTurn
{
  int64 id = 1;
}

message VoiceInterrupted
{
  int64 id = 1;
}

message VoiceEvent
{
  ReactionKind reaction = 1;
  float intensity = 2;
  string because = 3;
}

enum ReactionKind
{
  REACTION_IDLE = 0;
  REACTION_WARM = 1;
  REACTION_THINKING = 2;
  REACTION_UNCERTAIN = 3;
  REACTION_ATTENTIVE = 4;
  REACTION_RECOGNIZING = 5;
  REACTION_CURIOUS = 6;
  REACTION_ACKNOWLEDGING = 7;
  REACTION_CONFUSED = 8;
  REACTION_ALARMED = 9;
}

message VoiceAction
{
  int64 id = 1;
  string name = 2;
  string arguments = 3;
}

message VoiceDone
{
  int64 session_id = 1;
}

message TtsChunk
{
  bytes pcm = 1;
}

message ServerFrame
{
  oneof body
  {
    VoiceStt stt = 1;
    VoiceAssistant assistant = 2;
    VoiceEvent event = 3;
    VoiceDone done = 4;
    TtsChunk tts_chunk = 5;
    VoiceTurn turn = 6;
    VoiceInterrupted interrupted = 7;
    VoiceAction action = 8;
  }
}

message RtcJoin
{
  string room = 1;
  string agent_token = 2;
  string user_identity = 3;
  VoiceIdentity identity = 4;
  VoiceMode mode = 5;
  bool resume = 6;
  string call_id = 7;
  string opening_line = 8;
  string call_kind = 9;
}

message RtcJoined
{
  bool joined = 1;
  bool already = 2;
}

message RtcFarewell
{
  string room = 1;
  string user_identity = 2;
  string reason = 3;
}

message RtcFarewellDone
{
  bool played = 1;
}

message AnnounceRequest
{
  int64 user_id = 1;
  string text = 2;
  string kind = 3;
  string call_id = 4;
}

message AnnounceResponse
{
  bool delivered = 1;
}

service VoiceService
{
  rpc Connect(stream ClientFrame) returns (stream ServerFrame) {}
  rpc JoinRoom(RtcJoin) returns (RtcJoined) {}
  rpc Announce(AnnounceRequest) returns (AnnounceResponse) {}
  rpc Farewell(RtcFarewell) returns (RtcFarewellDone) {}
}
