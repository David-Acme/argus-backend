syntax = "proto3";

package argus.camera.v1;

import "argus/common/v1/base.proto";

option cc_enable_arenas = true;

message StreamChunk {
  bytes data = 1;
  bool init = 2;
  bool keyframe = 3;
  uint64 sequence = 4;
  int64 timestamp_us = 5;
}

message TalkAudio {
  bytes pcm = 1;
}

service StreamService {
  rpc Subscribe(SubscribeRequest) returns (stream StreamChunk);
}

message SubscribeRequest {
  argus.common.v1.RequestContext context = 1;
  string camera_id = 2;
  bool audio = 3;
}

service TalkService {
  rpc SendTalk(TalkAudio) returns (argus.common.v1.Envelope);
}
