syntax = "proto3";

package argus.camera.v1;

import "argus/common/v1/base.proto";

option cc_enable_arenas = true;

message Camera {
  string id = 1;
  string name = 2;
  string driver = 3;
  string rtsp_url = 4;
  string record_mode = 5;
  bool enabled = 6;
  int64 created_at = 7;
}

message CameraStatus {
  string camera_id = 1;
  bool online = 2;
  int32 battery = 3;
  string signal = 4;
}

service CameraService {
  rpc CreateCamera(CreateCameraRequest) returns (argus.common.v1.Envelope);
  rpc UpdateCamera(UpdateCameraRequest) returns (argus.common.v1.Envelope);
  rpc DeleteCamera(DeleteCameraRequest) returns (argus.common.v1.Envelope);
  rpc GetCameraStatus(GetCameraStatusRequest) returns (argus.common.v1.Envelope);
}

message CreateCameraRequest {
  argus.common.v1.RequestContext context = 1;
  string name = 2;
  string driver = 3;
  string rtsp_url = 4;
  string record_mode = 5;
  bool enabled = 6;
}

message UpdateCameraRequest {
  argus.common.v1.RequestContext context = 1;
  string id = 2;
  optional string name = 3;
  optional string rtsp_url = 4;
  optional string record_mode = 5;
  optional bool enabled = 6;
}

message DeleteCameraRequest {
  argus.common.v1.RequestContext context = 1;
  string id = 2;
}

message GetCameraStatusRequest {
  argus.common.v1.RequestContext context = 1;
  string camera_id = 2;
}
