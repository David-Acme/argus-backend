syntax = "proto3";

package argus.camera.v1;

option cc_enable_arenas = true;

message SyncRange {
  optional int64 start_time = 1;
  optional int64 start_id = 2;
  optional int64 end_time = 3;
}

message CameraRow {
  int64 id = 1;
  string name = 2;
  string manufacturer = 3;
  string model = 4;
  string ip = 5;
  int32 port = 6;
  string username = 7;
  string cloud_username = 8;
  string driver = 9;
  string icon = 10;
  string record_mode = 11;
  optional int64 retention_days = 12;
  string capabilities = 13;
  string config = 14;
  bool is_enabled = 15;
  bool is_online = 16;
  int64 created_at = 17;
  optional int64 updated_at = 18;
  optional int64 deleted_at = 19;
}

message ZoneRow {
  int64 id = 1;
  int64 camera_id = 2;
  string name = 3;
  string points = 4;
  string zone_type = 5;
  string color = 6;
  bool is_enabled = 7;
  int64 created_at = 8;
  optional int64 updated_at = 9;
  optional int64 deleted_at = 10;
}

message CameraStreamRow {
  int64 id = 1;
  int64 camera_id = 2;
  string label = 3;
  string url = 4;
  string resolution = 5;
  int32 fps = 6;
  string codec = 7;
  bool is_primary = 8;
  bool is_enabled = 9;
  int64 created_at = 10;
  optional int64 updated_at = 11;
  optional int64 deleted_at = 12;
}

message DeletedRow {
  int64 id = 1;
  int64 deleted_at = 2;
}

message TablePull {
  bool required_create = 1;
  bool required_deleted = 2;
  bool find_last_created = 3;
  bool find_last_deleted = 4;
  optional SyncRange created = 5;
  optional SyncRange deleted = 6;
}

message CameraTableRows {
  repeated CameraRow created = 1;
  repeated DeletedRow deleted = 2;
  optional CameraRow last_created = 3;
  optional DeletedRow last_deleted = 4;
}

message CameraStreamTableRows {
  repeated CameraStreamRow created = 1;
  repeated DeletedRow deleted = 2;
  optional CameraStreamRow last_created = 3;
  optional DeletedRow last_deleted = 4;
}

message ZoneTableRows {
  repeated ZoneRow created = 1;
  repeated DeletedRow deleted = 2;
  optional ZoneRow last_created = 3;
  optional DeletedRow last_deleted = 4;
}

message PullTableRequest {
  oneof table {
    TablePull camera = 1;
    TablePull camera_stream = 2;
    TablePull zone = 3;
  }
}

message PullTableResponse {
  oneof table {
    CameraTableRows camera = 1;
    CameraStreamTableRows camera_stream = 2;
    ZoneTableRows zone = 3;
  }
}

message CatalogCamera {
  int64 id = 1;
  string name = 2;
}

message CatalogZone {
  int64 id = 1;
  string name = 2;
}

message CatalogStream {
  int64 id = 1;
  string label = 2;
}

message ListCatalogRequest {
}

message ListCatalogResponse {
  repeated CatalogCamera cameras = 1;
  repeated CatalogZone zones = 2;
  repeated CatalogStream streams = 3;
}

service SyncService {
  rpc PullTable(PullTableRequest) returns (PullTableResponse) {}

  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse) {}
}
