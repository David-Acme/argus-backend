syntax = "proto3";

package argus.camera.v1;

option cc_enable_arenas = true;

enum WatchRefusal
{
  WATCH_REFUSAL_NONE = 0;
  WATCH_REFUSAL_AUDIO_WITHHELD = 1;
  WATCH_REFUSAL_WATCHMAN_OFF = 2;
  WATCH_REFUSAL_CAMERA_OFF = 3;
  WATCH_REFUSAL_NO_AUDIO = 4;
  WATCH_REFUSAL_MASKED = 5;
  WATCH_REFUSAL_DISABLED = 6;
  WATCH_REFUSAL_MODULE_OFF = 7;
  WATCH_REFUSAL_UNKNOWN_CAMERA = 8;
  WATCH_REFUSAL_NO_TALK = 9;
  WATCH_REFUSAL_SHUTTING_DOWN = 10;
  WATCH_REFUSAL_CAPACITY = 11;
}

message WatchCamera
{
  int64 camera_id = 1;
  string name = 2;
  bool listening = 3;
  WatchRefusal refusal = 4;
  bool talk = 5;
  bool pan_tilt = 6;
  bool tv_exclusion = 7;
}

message ListWatchRequest
{
}

message ListWatchResponse
{
  repeated WatchCamera cameras = 1;
}

message MicrophoneRequest
{
  int64 camera_id = 1;
}

message MicrophoneFrame
{
  bytes pcm = 1;
  uint64 sequence = 2;
  int64 captured_at_ms = 3;
  bool gap = 4;
}

message SpeakOpen
{
  int64 camera_id = 1;
  int32 sample_rate = 2;
  bool earcon = 3;
  string conversation_id = 4;
}

message SpeakEnd
{
}

message SpeakFrame
{
  oneof body
  {
    SpeakOpen open = 1;
    bytes pcm = 2;
    SpeakEnd end = 3;
  }
}

enum SpeakState
{
  SPEAK_STATE_UNSPECIFIED = 0;
  SPEAK_STATE_READY = 1;
  SPEAK_STATE_PLAYING = 2;
  SPEAK_STATE_DONE = 3;
  SPEAK_STATE_BUSY = 4;
  SPEAK_STATE_REFUSED = 5;
  SPEAK_STATE_LINE_LOST = 6;
}

message SpeakEvent
{
  SpeakState state = 1;
  int64 played_ms = 2;
  int64 queued_ms = 3;
  int64 playback_end_ms = 4;
  WatchRefusal refusal = 5;
  string detail = 6;
}

message FaceWindowRequest
{
  int64 camera_id = 1;
  int32 window_ms = 2;
}

message SeenFace
{
  int64 person_id = 1;
  int64 user_id = 2;
  string name = 3;
  string role = 4;
  float confidence = 5;
  string quality = 6;
  bool visitor = 7;
  bool trusted = 8;
  bool matched = 9;
}

message FaceWindowResponse
{
  repeated SeenFace faces = 1;
  int32 crops = 2;
}

message SightingsRequest
{
  int64 since_ms = 1;
}

message Sighting
{
  int64 camera_id = 1;
  int64 track_id = 2;
  int64 person_id = 3;
  bool known = 4;
  float center_x = 5;
  float center_y = 6;
  float width = 7;
  float height = 8;
  bool night = 9;
  int64 at_ms = 10;
}

message SightingsResponse
{
  repeated Sighting sightings = 1;
}

enum AimMode
{
  AIM_MODE_FIND = 0;
  AIM_MODE_RELEASE = 1;
}

enum AimOutcome
{
  AIM_OUTCOME_UNSPECIFIED = 0;
  AIM_OUTCOME_CENTERED = 1;
  AIM_OUTCOME_IN_FRAME = 2;
  AIM_OUTCOME_NOT_FOUND = 3;
  AIM_OUTCOME_REFUSED = 4;
  AIM_OUTCOME_NO_PTZ = 5;
  AIM_OUTCOME_RELEASED = 6;
}

message AimRequest
{
  int64 camera_id = 1;
  string conversation_id = 2;
  AimMode mode = 3;
}

message AimResponse
{
  AimOutcome outcome = 1;
  string detail = 2;
}

service CameraWatchService
{
  rpc ListWatch(ListWatchRequest) returns (ListWatchResponse) {}
  rpc OpenMicrophone(MicrophoneRequest) returns (stream MicrophoneFrame) {}
  rpc Speak(stream SpeakFrame) returns (stream SpeakEvent) {}
  rpc FaceWindow(FaceWindowRequest) returns (FaceWindowResponse) {}
  rpc Sightings(SightingsRequest) returns (SightingsResponse) {}
  rpc Aim(AimRequest) returns (AimResponse) {}
}
