syntax = "proto3";

package argus.sync.v1;

import "argus/sync/v1/contracts.proto";

option cc_enable_arenas = true;

message ReplaceRoleRoomsRequest
{
  int64 user_id = 1;
  string old_role = 2;
  string new_role = 3;
}

message DisconnectUserRequest
{
  int64 user_id = 1;
  SyncFrame frame = 2;
}

message EmitToUserRequest
{
  int64 user_id = 1;
  SyncFrame frame = 2;
}

message CloseCallRoomRequest
{
  int64 user_id = 1;
  int64 call_id = 2;
  bool only_if_empty = 3;
}

message CloseCallRoomAck
{
  bool ok = 1;
  string reason = 2;
  bool closed = 3;
}

message ControlAck
{
  bool ok = 1;
  string reason = 2;
}

service SyncControlService
{
  rpc ReplaceRoleRooms(ReplaceRoleRoomsRequest) returns (ControlAck) {}

  rpc DisconnectUser(DisconnectUserRequest) returns (ControlAck) {}

  rpc EmitToUser(EmitToUserRequest) returns (ControlAck) {}

  rpc CloseCallRoom(CloseCallRoomRequest) returns (CloseCallRoomAck) {}
}
