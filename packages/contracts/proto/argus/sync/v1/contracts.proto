syntax = "proto3";

package argus.sync.v1;

option cc_enable_arenas = true;

enum SyncOperation {
  option allow_alias = true;

  SYNC_OPERATION_UNSPECIFIED = 0;
  SYNC_OPERATION_INITIAL_INFO = 0;
  SYNC_OPERATION_SYNCHRONIZE = 1;
  SYNC_OPERATION_SYNCHRONIZE_AUDIT_LOG = 2;
  SYNC_OPERATION_SYNCHRONIZE_USER_AUDIT_LOG = 3;
  SYNC_OPERATION_ADD = 4;
  SYNC_OPERATION_DELETE = 5;
  SYNC_OPERATION_LOG = 6;
  SYNC_OPERATION_AUTH_CONTEXT_CHANGED = 7;
  SYNC_OPERATION_CALL_INCOMING = 8;
  SYNC_OPERATION_CALL_CANCEL = 9;
}

enum TableName {
  option allow_alias = true;

  TABLE_NAME_UNSPECIFIED = 0;
  TABLE_NAME_USER = 0;
  TABLE_NAME_USER_INVITATION = 1;
  TABLE_NAME_PERSON = 2;
  TABLE_NAME_PERSON_EVENT = 3;
  TABLE_NAME_EVENT = 4;
  TABLE_NAME_REMINDER = 5;
  TABLE_NAME_REMINDER_DETAIL = 6;
  TABLE_NAME_CALENDAR_EVENT = 7;
  TABLE_NAME_CALENDAR_EVENT_SHARE = 8;
  TABLE_NAME_PROJECT = 9;
  TABLE_NAME_PROJECT_MEMBER = 10;
  TABLE_NAME_PROJECT_TASK = 11;
  TABLE_NAME_CONTEXT_NOTE = 12;
  TABLE_NAME_CAMERA = 13;
  TABLE_NAME_CAMERA_STREAM = 14;
  TABLE_NAME_ZONE = 15;
  TABLE_NAME_AUDIT_LOG = 16;
  TABLE_NAME_USER_AUDIT_LOG = 17;
  TABLE_NAME_NOTIFICATION = 18;
  TABLE_NAME_NOTIFICATION_TOKEN = 19;
  TABLE_NAME_USER_ACTION_LOG = 20;
  TABLE_NAME_REFRESH_TOKEN = 21;
  TABLE_NAME_FACE_EMBEDDING = 22;
  TABLE_NAME_MEMORY = 23;
}

message SyncPage {
  uint32 limit = 1;
}

message SyncFrame {
  SyncOperation operation = 1;
  TableName table = 2;
  string info = 3;
}

message AuditCursor {
  uint64 after_id = 1;
  uint64 end_id = 2;
}
