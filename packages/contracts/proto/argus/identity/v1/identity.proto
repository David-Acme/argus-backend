syntax = "proto3";

package argus.identity.v1;

message UserIdentity
{
  int64 user_id = 1;
  string name = 2;
  string lang = 3;
  optional string last_name = 4;
  optional string role = 5;
  optional bool is_active = 6;
}

message UpdateUserRequest
{
  int64 user_id = 1;
  optional string name = 2;
}

message UpdateUserResponse
{
  UserIdentity user = 1;
}

message RegisterUserRequest
{
  bytes image = 1;
  optional string name = 2;
  optional string invitation_token = 3;
  optional string lang = 4;
}

enum RegisterUserOutcome
{
  REGISTER_USER_OUTCOME_UNSPECIFIED = 0;
  REGISTER_USER_ENROLLED = 1;
  REGISTER_USER_ALREADY_REGISTERED = 2;
  REGISTER_USER_NOT_PAIRED = 3;
  REGISTER_USER_FACE_EXTRACTION_FAILED = 4;
  REGISTER_USER_FACE_ALREADY_REGISTERED = 5;
  REGISTER_USER_FACE_NOT_RECOGNIZED = 6;
  REGISTER_USER_INVITATION_REQUIRED = 7;
  REGISTER_USER_INVITATION_INVALID = 8;
  REGISTER_USER_OWNER_ALREADY_EXISTS = 9;
  REGISTER_USER_FACE_INDEX_FAILED = 10;
}

message RegisterUserResponse
{
  RegisterUserOutcome outcome = 1;
  UserIdentity user = 2;
  optional int64 person_id = 3;
}

message GetUserRequest
{
  int64 user_id = 1;
}

message GetUserResponse
{
  UserIdentity user = 1;
}

message CatalogPerson
{
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string alias = 4;
}

message ListPersonsRequest
{
}

message ListPersonsResponse
{
  repeated CatalogPerson persons = 1;
}

message IdentifyPersonRequest
{
  bytes image = 1;
}

message IdentifyPersonResponse
{
  bool matched = 1;
  int64 person_id = 2;
  float confidence = 3;
  optional int64 user_id = 4;
  optional string role = 5;
  optional string name = 6;
  bool trusted = 7;
  optional string last_name = 8;
  optional bool face_found = 9;
}

message EnrollPersonRequest
{
  bytes image = 1;
  int64 camera_id = 2;
  bool capture_snapshot = 3;
}

message EnrollPersonResponse
{
  int64 person_id = 1;
  bool created = 2;
  float confidence = 3;
}

message TouchPersonRequest
{
  int64 person_id = 1;
  int64 at = 2;
}

message TouchPersonResponse
{
  bool updated = 1;
}

message TagPersonRequest
{
  int64 person_id = 1;
  repeated string tags = 2;
  string source = 3;
  string observation = 4;
}

message TagPersonResponse
{
  int32 added = 1;
}

message PersonTagsRequest
{
  int64 person_id = 1;
}

message PersonTagsResponse
{
  repeated string tags = 1;
}

message PersonIdentity
{
  int64 person_id = 1;
  optional int64 user_id = 2;
  optional string name = 3;
  optional string alias = 4;
  optional string observation = 5;
  optional string role = 6;
  repeated string tags = 7;
  bool trusted = 8;
}

message GetPersonRequest
{
  int64 person_id = 1;
}

message GetPersonResponse
{
  optional PersonIdentity person = 1;
}

message PromotePersonRequest
{
  int64 person_id = 1;
}

message PromotePersonResponse
{
  bool promoted = 1;
}

message ListNotifiableUsersRequest
{
}

message ListNotifiableUsersResponse
{
  repeated int64 user_ids = 1;
}

service IdentityService
{
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {}

  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {}

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {}

  rpc ListPersons(ListPersonsRequest) returns (ListPersonsResponse) {}

  rpc IdentifyPerson(IdentifyPersonRequest) returns (IdentifyPersonResponse) {}

  rpc EnrollPerson(EnrollPersonRequest) returns (EnrollPersonResponse) {}

  rpc TouchPerson(TouchPersonRequest) returns (TouchPersonResponse) {}

  rpc TagPerson(TagPersonRequest) returns (TagPersonResponse) {}

  rpc GetPersonTags(PersonTagsRequest) returns (PersonTagsResponse) {}

  rpc GetPerson(GetPersonRequest) returns (GetPersonResponse) {}

  rpc PromotePerson(PromotePersonRequest) returns (PromotePersonResponse) {}

  rpc ListNotifiableUsers(ListNotifiableUsersRequest)
      returns (ListNotifiableUsersResponse) {}
}
