syntax = "proto3";

package argus.identity.v1;

message VoiceClip
{
  bytes pcm16 = 1;
  int32 sample_rate = 2;
}

enum VoiceprintOutcome
{
  VOICEPRINT_OUTCOME_UNSPECIFIED = 0;
  VOICEPRINT_OK = 1;
  VOICEPRINT_UNAVAILABLE = 2;
  reserved 3, 4;
  VOICEPRINT_SAMPLE_INVALID = 5;
  VOICEPRINT_SAMPLE_TOO_SHORT = 6;
  VOICEPRINT_SAMPLE_TOO_NOISY = 7;
  VOICEPRINT_SAMPLE_CLIPPED = 8;
  reserved 9 to 17;
}

enum VoiceprintVerdict
{
  VOICEPRINT_VERDICT_UNSPECIFIED = 0;
  VOICEPRINT_VERDICT_HOLDER = 1;
  VOICEPRINT_VERDICT_OTHER_KNOWN = 2;
  VOICEPRINT_VERDICT_UNFAMILIAR = 3;
}

message IdentifyVoiceRequest
{
  VoiceClip sample = 1;
}

message IdentifyVoiceResponse
{
  VoiceprintOutcome outcome = 1;
  bool matched = 2;
  int64 user_id = 3;
  float score = 4;
  float threshold = 5;
  optional int64 person_id = 6;
  optional string name = 7;
  optional string role = 8;
  optional float holder_score = 9;
  optional bool holder_profile = 10;
  optional VoiceprintVerdict verdict = 11;
}

message ObserveVoiceTurnRequest
{
  VoiceClip sample = 1;
  int64 user_id = 2;
  string device_hash = 3;
  string call_key = 4;
}

message CloseVoiceCallRequest
{
  string call_key = 1;
}

message CloseVoiceCallResponse
{
  bool closed = 1;
}

service VoiceprintService
{
  rpc Identify(IdentifyVoiceRequest) returns (IdentifyVoiceResponse) {}

  rpc ObserveTurn(ObserveVoiceTurnRequest) returns (IdentifyVoiceResponse) {}

  rpc CloseCall(CloseVoiceCallRequest) returns (CloseVoiceCallResponse) {}
}
