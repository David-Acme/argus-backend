syntax = "proto3";

package argus.stt.v1;

service Transcription {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc TranscribeStream(stream TranscribeChunk) returns (stream TranscribeUpdate);
  rpc Spot(stream SpotChunk) returns (stream SpotEvent);
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  uint32 sample_rate = 1;
  bool loaded = 2;
  string language = 3;
  string default_language = 4;
  repeated string languages = 5;
}

message TranscribeRequest {
  repeated float samples = 1;
  uint32 sample_rate = 2;
  string language = 3;
}

message TranscribeResponse {
  string text = 1;
}

message TranscribeChunk {
  repeated float samples = 1;
  uint32 sample_rate = 2;
  string language = 3;
  bool flush = 4;
}

message TranscribeUpdate {
  string text = 1;
  bool final = 2;
  uint64 samples = 3;
  uint32 decode_ms = 4;
}

message SpotChunk {
  repeated float samples = 1;
  uint32 sample_rate = 2;
  bool reset = 3;
}

message SpotEvent {
  string keyword = 1;
  uint64 at_sample = 2;
  float start_time = 3;
}
