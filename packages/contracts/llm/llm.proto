syntax = "proto3";

package argus.llm.v1;

service Chat {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ChatStream(ChatRequest) returns (stream ChatToken);
  rpc Screen(ScreenRequest) returns (ScreenResponse);
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  bool loaded = 1;
  int32 default_max_tokens = 2;
  float default_temperature = 3;
  int64 context_size = 4;
  int32 last_prompt_tokens = 5;
  int32 last_reused_tokens = 6;
  int32 last_decoded_tokens = 7;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

enum CallerRole {
  CALLER_ROLE_UNSPECIFIED = 0;
  CALLER_ROLE_OWNER = 1;
  CALLER_ROLE_RESIDENT = 2;
  CALLER_ROLE_GUARD = 3;
  CALLER_ROLE_GUEST = 4;
}

enum ConversationLeg {
  CONVERSATION_LEG_UNSPECIFIED = 0;
  CONVERSATION_LEG_CAMERA = 1;
  CONVERSATION_LEG_PHONE = 2;
  CONVERSATION_LEG_LAPTOP = 3;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  int32 max_tokens = 2;
  optional float temperature = 3;
  bool reset_context = 4;
  optional bool tools = 5;
  int64 user_id = 6;
  string grammar = 7;
  bool grammar_required = 8;
  CallerRole caller_role = 9;
  string lang = 10;
  bool client_actions = 11;
  string session_id = 12;
  bool prefill_only = 13;
  ConversationLeg conversation_leg = 17;
  bool use_conversation = 18;
  reserved 14, 15, 16;
  reserved "turn_speaker", "holder_name", "context_facts";
  ConversationSurface surface = 19;
}

enum ConversationSurface {
  CONVERSATION_SURFACE_APP = 0;
  CONVERSATION_SURFACE_CAMERA = 1;
  CONVERSATION_SURFACE_CAMERA_VISITOR = 2;
}

message ChatResponse {
  string text = 1;
}

message ClientAction {
  string name = 1;
  string arguments = 2;
}

message ChatToken {
  uint32 sequence = 1;
  string text = 2;
  bool done = 3;
  int32 prompt_tokens = 4;
  int32 reused_tokens = 5;
  int32 decoded_tokens = 6;
  ClientAction action = 7;
  string speech = 8;
}

message ScreenRequest {
  string text = 1;
  int64 user_id = 2;
  CallerRole caller_role = 3;
}

message ScreenResponse {
  string text = 1;
}
