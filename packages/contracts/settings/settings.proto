syntax = "proto3";

package argus.settings.v1;

option cc_enable_arenas = true;

enum SettingType {
  SETTING_TYPE_UNSPECIFIED = 0;
  SETTING_TYPE_TOGGLE = 1;
  SETTING_TYPE_INTEGER = 2;
  SETTING_TYPE_DECIMAL = 3;
  SETTING_TYPE_CHOICE = 4;
  SETTING_TYPE_TEXT = 5;
}

enum SettingLevel {
  SETTING_LEVEL_UNSPECIFIED = 0;
  SETTING_LEVEL_BASIC = 1;
  SETTING_LEVEL_ADVANCED = 2;
}

enum SettingApply {
  SETTING_APPLY_UNSPECIFIED = 0;
  SETTING_APPLY_LIVE = 1;
  SETTING_APPLY_NEXT_SESSION = 2;
  SETTING_APPLY_RESTART = 3;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  REJECTION_REASON_UNKNOWN_KEY = 1;
  REJECTION_REASON_INVALID = 2;
  REJECTION_REASON_OUT_OF_RANGE = 3;
  REJECTION_REASON_NOT_A_CHOICE = 4;
  REJECTION_REASON_WRITE_FAILED = 5;
  REJECTION_REASON_NOT_INSTALLED = 6;
}

enum ChoiceAvailability {
  CHOICE_AVAILABILITY_UNSPECIFIED = 0;
  CHOICE_AVAILABILITY_INSTALLED = 1;
  CHOICE_AVAILABILITY_INSTALLABLE = 2;
  CHOICE_AVAILABILITY_INSTALLING = 3;
  CHOICE_AVAILABILITY_HOST_ONLY = 4;
  CHOICE_AVAILABILITY_FAILED = 5;
}

enum ProfileOrigin {
  PROFILE_ORIGIN_UNSPECIFIED = 0;
  PROFILE_ORIGIN_RECOMMENDED = 1;
  PROFILE_ORIGIN_OWNER = 2;
  PROFILE_ORIGIN_REVERTED = 3;
}

message ChoiceState {
  string choice = 1;
  ChoiceAvailability availability = 2;
  double size_mb = 3;
  string host_command = 4;
}

message Setting {
  string key = 1;
  string group = 2;
  SettingType type = 3;
  SettingLevel level = 4;
  SettingApply apply = 5;
  double min = 6;
  double max = 7;
  double step = 8;
  repeated string choices = 9;
  string value = 10;
  string fallback = 11;
  repeated ChoiceState choice_states = 12;
  string unit = 13;
  bool pending_restart = 14;
}

message ProfileMarker {
  string id = 1;
  ProfileOrigin origin = 2;
  int64 applied_at = 3;
  repeated string keys = 4;
}

message ListSettingsRequest {}

message SettingsCatalog {
  string service = 1;
  repeated Setting settings = 2;
  string config_path = 3;
  ProfileMarker profile = 4;
  repeated string capabilities = 5;
}

message SettingChange {
  string key = 1;
  string value = 2;
}

message UpdateSettingsRequest {
  repeated SettingChange changes = 1;
  ProfileMarker profile = 2;
}

message SettingRejection {
  string key = 1;
  RejectionReason reason = 2;
}

message UpdateSettingsResponse {
  repeated string applied = 1;
  repeated SettingRejection rejected = 2;
  SettingsCatalog catalog = 3;
  bool profile_recorded = 4;
}

enum ComponentSource {
  COMPONENT_SOURCE_UNSPECIFIED = 0;
  COMPONENT_SOURCE_DOWNLOAD = 1;
  COMPONENT_SOURCE_PROVISIONED = 2;
}

enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  COMPONENT_STATE_INSTALLED = 1;
  COMPONENT_STATE_MISSING = 2;
  COMPONENT_STATE_INSTALLING = 3;
  COMPONENT_STATE_FAILED = 4;
  COMPONENT_STATE_HOST_ONLY = 5;
}

message ComponentFile {
  string path = 1;
  string url = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
}

message ComponentSpec {
  string id = 1;
  ComponentSource source = 2;
  repeated ComponentFile files = 3;
  string host_command = 4;
}

message ComponentStatus {
  string id = 1;
  ComponentState state = 2;
  int64 bytes_present = 3;
  int64 bytes_total = 4;
  bool ready = 5;
  string host_command = 6;
  string reason = 7;
}

message ComponentStatesRequest {
  repeated ComponentSpec components = 1;
}

message ComponentStatesResponse {
  repeated ComponentStatus components = 1;
}

message ComponentRequest {
  ComponentSpec component = 1;
}

message ComponentResponse {
  ComponentStatus status = 1;
}

message ModuleDataRequest {
  string module_id = 1;
}

message ModuleDataItem {
  string kind = 1;
  int64 count = 2;
}

message ModuleDataSummaryResponse {
  repeated ModuleDataItem items = 1;
  int64 bytes = 2;
}

message PurgeModuleDataResponse {
  bool purged = 1;
  string reason = 2;
}

enum PinVerdict {
  PIN_VERDICT_UNSPECIFIED = 0;
  PIN_VERDICT_NO_PIN = 1;
  PIN_VERDICT_ACCEPTED = 2;
  PIN_VERDICT_REQUIRED = 3;
  PIN_VERDICT_INVALID = 4;
  PIN_VERDICT_LOCKED = 5;
}

message VerifyOwnerPinRequest {
  int64 user_id = 1;
  string pin = 2;
}

message VerifyOwnerPinResponse {
  PinVerdict verdict = 1;
}

message ModuleImpactRequest {
  string module_id = 1;
}

message ImpactRoleHolder {
  int64 user_id = 1;
  string name = 2;
  string last_name = 3;
  string role = 4;
  bool is_active = 5;
}

message ImpactInvitation {
  int64 id = 1;
  string role = 2;
  int64 created_by = 3;
  string created_by_name = 4;
  int64 expires_at = 5;
}

message ModuleImpactResponse {
  repeated ModuleDataItem stops = 1;
  repeated ImpactRoleHolder role_holders = 2;
  repeated ImpactInvitation invitations = 3;
}

message RoleReassignment {
  int64 user_id = 1;
  string role = 2;
}

message ReassignRolesRequest {
  int64 actor_user_id = 1;
  repeated RoleReassignment reassignments = 2;
}

enum ReassignStatus {
  REASSIGN_STATUS_UNSPECIFIED = 0;
  REASSIGN_STATUS_APPLIED = 1;
  REASSIGN_STATUS_REFUSED = 2;
  REASSIGN_STATUS_FAILED = 3;
}

message ReassignRolesResponse {
  ReassignStatus status = 1;
  int32 applied = 2;
  int64 failed_user_id = 3;
  string reason = 4;
}

message RequestModuleRequest {
  string module_id = 1;
  string module_name_es = 2;
  string module_name_en = 3;
  int64 user_id = 4;
  string day = 5;
}

message RequestModuleResponse {
  int32 notified = 1;
  bool duplicate = 2;
}

message ModuleStatesRequest {}

message ModuleIntroLine {
  string what = 1;
  repeated string examples = 2;
}

message ModuleEnabled {
  string id = 1;
  bool enabled = 2;
  string lifecycle = 3;
  int64 data_purged_at = 4;
  repeated string roles = 5;
  string name_es = 6;
  string name_en = 7;
  string summary_es = 8;
  string summary_en = 9;
  ModuleIntroLine intro_es = 10;
  ModuleIntroLine intro_en = 11;
  string kind = 12;
}

message OwnerCatalogRequest {}

message OwnerCatalogResponse {
  string modules_json = 1;
  int64 version = 2;
}

message ModuleStatesResponse {
  repeated ModuleEnabled modules = 1;
  int64 version = 2;
  bool settled = 3;
  string epoch = 4;
}

service Settings {
  rpc List(ListSettingsRequest) returns (SettingsCatalog);
  rpc Update(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc ComponentStates(ComponentStatesRequest) returns (ComponentStatesResponse);
  rpc InstallComponent(ComponentRequest) returns (ComponentResponse);
  rpc CancelComponent(ComponentRequest) returns (ComponentResponse);
  rpc RemoveComponent(ComponentRequest) returns (ComponentResponse);
  rpc ModuleDataSummary(ModuleDataRequest) returns (ModuleDataSummaryResponse);
  rpc PurgeModuleData(ModuleDataRequest) returns (PurgeModuleDataResponse);
  rpc VerifyOwnerPin(VerifyOwnerPinRequest) returns (VerifyOwnerPinResponse);
  rpc ModuleImpact(ModuleImpactRequest) returns (ModuleImpactResponse);
  rpc ReassignRoles(ReassignRolesRequest) returns (ReassignRolesResponse);
  rpc RequestModule(RequestModuleRequest) returns (RequestModuleResponse);
}

service Modules {
  rpc ModuleStates(ModuleStatesRequest) returns (ModuleStatesResponse);
  rpc OwnerCatalog(OwnerCatalogRequest) returns (OwnerCatalogResponse);
}
