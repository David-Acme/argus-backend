name: argus-local

# Default local stack: RustFS only. The backend is intentionally behind the
# `backend` profile so native development and emulators do not consume extra
# RAM. Run `docker compose --profile backend up --build` only when validating
# the future containerised backend.
services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    entrypoint: ["/bin/sh", "/opt/argus/rustfs-entrypoint.sh"]
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
      RUSTFS_RPC_SECRET_FILE_PATH: /run/secrets/rustfs_rpc_secret
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
      - ./docker/rustfs-entrypoint.sh:/opt/argus/rustfs-entrypoint.sh:ro
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - rustfs_rpc_secret
    networks:
      - storage-internal
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: "${RUSTFS_MEMORY_LIMIT:-512m}"
    cpus: "${RUSTFS_CPU_LIMIT:-1.00}"
    pids_limit: 128
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc:v0.1.31
    entrypoint: ["/bin/sh", "/opt/argus/rustfs-init.sh"]
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: "${RUSTFS_REGION:-us-east-1}"
      RUSTFS_BUCKET_FILE: /run/argus/rustfs-bucket
    volumes:
      - ./docker/rustfs-init.sh:/opt/argus/rustfs-init.sh:ro
      - ./docker/runtime/rustfs-bucket:/run/argus/rustfs-bucket:ro
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - argus_s3_access_key
      - argus_s3_secret_key
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - storage-internal
    restart: "no"

  backend:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ARGUS_UID: "${ARGUS_UID:-1000}"
        ARGUS_GID: "${ARGUS_GID:-1000}"
    environment:
      ARGUS_STORAGE_TRANSPORT: bridge
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    ports:
      - "${ARGUS_HTTP_PORT:-7024}:7024"
    volumes:
      - type: bind
        source: ./certs
        target: /opt/argus/certs
        bind:
          create_host_path: false
      - type: bind
        source: ./config.local.toml
        target: /opt/argus/config.local.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database
        target: /opt/argus/database
        bind:
          create_host_path: false
      - type: bind
        source: ./models
        target: /opt/argus/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./third_party/go2rtc
        target: /opt/argus/third_party/go2rtc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./uploads
        target: /opt/argus/uploads
        bind:
          create_host_path: false
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    networks:
      - app
      - storage-internal
    mem_limit: "${ARGUS_BACKEND_MEMORY_LIMIT:-6g}"
    cpus: "${ARGUS_BACKEND_CPU_LIMIT:-4.00}"
    pids_limit: 1024
    restart: unless-stopped

secrets:
  rustfs_access_key:
    file: ./docker/runtime/secrets/rustfs_access_key
  rustfs_secret_key:
    file: ./docker/runtime/secrets/rustfs_secret_key
  rustfs_rpc_secret:
    file: ./docker/runtime/secrets/rustfs_rpc_secret
  argus_s3_access_key:
    file: ./docker/runtime/secrets/argus_s3_access_key
  argus_s3_secret_key:
    file: ./docker/runtime/secrets/argus_s3_secret_key

volumes:
  rustfs-data:
    name: argus-rustfs-data

networks:
  app:
    name: argus-app
  storage-internal:
    name: argus-storage-internal
    internal: true
