# ── Drogon HTTP server config ─────────────────────────────────────────────

[[drogon.listeners]]
address = "0.0.0.0"
port = 7024
https = false

[[drogon.db_clients]]
name = "default"
rdbms = "sqlite3"
filename = "database/argus.db"
is_fast = false
number_of_connections = 4
timeout = -1.0

[drogon.app]
number_of_threads = 0
enable_session = false
document_root = "./"
upload_path = "uploads"
use_sendfile = true
use_gzip = true
use_brotli = false
static_files_cache_time = 5
idle_connection_timeout = 60
enable_server_header = true
enable_date_header = true
keepalive_requests = 0
pipelining_requests = 0
gzip_static = true
br_static = true
client_max_body_size = "60M"
client_max_memory_body_size = "16M"
client_max_websocket_message_size = "128K"
reuse_port = false
enabled_compressed_request = false
enable_request_stream = false
handle_sig_term = true
relaunch_on_error = false

[[drogon.plugins]]
name = "drogon::plugin::PromExporter"
dependencies = []
[drogon.plugins.config]
path = "/metrics"

[[drogon.plugins]]
name = "drogon::plugin::AccessLogger"
dependencies = []
[drogon.plugins.config]
use_spdlog = false
log_path = ""
log_format = ""
log_file = "access.log"
log_size_limit = 0
use_local_time = true
log_index = 0

[drogon.custom_config]

# ── Application settings ──────────────────────────────────────────────────

[jwt]
secret = "secret"
refresh_secret = "refresh_secret"
access_ttl_minutes = 15
refresh_ttl_days = 30

[database]
file = "./database/argus.db"

# ── Face recognition ──────────────────────────────────────────────────
[face]
detect_target = 640
score_threshold = 0.5
nms_threshold = 0.4
ef_search = 100
top_k = 5

# ── LLM (LFM2.5-1.2B) ──────────────────────────────────────────────
[llm]
# Context window in tokens (Ollama default: 32768). Smaller = less KV
# cache RAM and faster decode as context grows; large enough for short
# security Q&A turns.
context_size = 32768
# Default max generated tokens per reply. 96 ≈ 2-3 lines with headroom.
max_tokens = 96
# Sampling temperature.
temperature = 0.3
# Threads for decode and prefill. 0 = auto (ThreadBudget: physical cores
# / light for decode, half hardware for prefill). Raise if the host has
# more cores or a stronger CPU.
threads = 0
batch_threads = 0
# Batch sizes (tokens). n_batch caps prompt tokens per pass, n_ubatch the
# physical sub-batch.
n_batch = 1024
n_ubatch = 512

# ── Vision (SmolVLM2-500M) ──────────────────────────────────────────
[vision]
# Input resolution is fixed at 512x512 by the SigLIP vision encoder
# (64 image tokens per frame).
image_size = 512
# Max generated tokens for the caption. The model describes the scene in
# 1-3 sentences, so 64 is plenty and keeps latency low.
max_tokens = 64
# Threads for ONNX Runtime sessions. 0 = auto (ThreadBudget physical cores).
threads = 0

[storage.s3]
endpoint = ""
access_key = ""
secret_key = ""
region = ""
bucket = ""
