# ── Drogon HTTP(S) server config ─────────────────────────────────────────
# HTTPS-only: the listener serves TLS on the advertised mDNS port. The
# certificate pair is generated by scripts/setup.sh into certs/ (instance CA
# + server leaf). Clients must pin certs/ca.pem (see POST /pairing).

[[drogon.listeners]]
address = "0.0.0.0"
port = 7024
https = true
cert = "certs/server.pem"
key = "certs/server.key"
ssl_conf = [["MinProtocol", "TLSv1.2"]]

[[drogon.db_clients]]
name = "default"
rdbms = "sqlite3"
filename = "database/argus.db"
is_fast = false
number_of_connections = 4
timeout = -1.0

[drogon.app]
number_of_threads = 0
enable_session = false
document_root = "./"
upload_path = "uploads"
use_sendfile = true
use_gzip = true
use_brotli = false
static_files_cache_time = 5
idle_connection_timeout = 60
enable_server_header = true
enable_date_header = true
keepalive_requests = 0
pipelining_requests = 0
gzip_static = true
br_static = true
client_max_body_size = "60M"
client_max_memory_body_size = "16M"
client_max_websocket_message_size = "128K"
reuse_port = false
enabled_compressed_request = false
enable_request_stream = false
handle_sig_term = true
relaunch_on_error = false

[[drogon.plugins]]
name = "drogon::plugin::PromExporter"
dependencies = []
[drogon.plugins.config]
path = "/metrics"

[[drogon.plugins]]
name = "drogon::plugin::AccessLogger"
dependencies = []
[drogon.plugins.config]
use_spdlog = false
log_path = ""
log_format = ""
log_file = "access.log"
log_size_limit = 0
use_local_time = true
log_index = 0

[drogon.custom_config]

# ── Application settings ──────────────────────────────────────────────────

[jwt]
secret = "secret"
refresh_secret = "refresh_secret"
access_ttl_minutes = 15
refresh_ttl_days = 30

[database]
file = "./database/argus.db"

# ── Face recognition ──────────────────────────────────────────────────
[face]
detect_target = 640
score_threshold = 0.5
nms_threshold = 0.4
ef_search = 100
top_k = 5

# ── LLM (LFM2.5-1.2B-Instruct) ────────────────────────────────────
[llm]
# GGUF model file (LFM Open License v1.0, see models/llm/LICENSE.lfm1.0).
# LFM2.5-1.2B-Instruct has NO thinking/CoT mode: it replies directly and
# decisively, with better reasoning than the 350M sibling. ~36 tok/s CPU.
model_path = "models/llm/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
# Context window in tokens (model supports up to 128k; 32768 = 32k).
# Smaller = less KV cache RAM and faster decode as context grows.
context_size = 32768
# Default max generated tokens per reply.
max_tokens = 256
# Sampling temperature.
temperature = 0.7
# Threads for decode and prefill. 0 = auto (ThreadBudget).
threads = 0
batch_threads = 0
# Batch sizes (tokens).
n_batch = 1024
n_ubatch = 512

# ── STT (FastConformer Transducer multilingüe) ─────────────────────
[stt]
# Engine: "nemo_transducer" (FastConformer RNN-T, en+de+es+fr, RTF ~0.02,
# best speed/accuracy balance), "canary" (NeMo Canary 180m flash, same
# accuracy, 5x slower), "whisper" (tiny/base/small, auto language),
# "nemo_ctc" (CTC single-pass, fastest but weaker English), or
# "omnilingual" (1600 languages). Model files live in models/stt/.
engine = "nemo_transducer"
# Language code: "es", "en" or "auto".
# Voice interfaces can switch it at runtime via SttService::setLanguage().
language = "es"

# ── Vision (SmolVLM2-500M) ──────────────────────────────────────────
[vision]
# Input resolution is fixed at 512x512 by the SigLIP vision encoder
# (64 image tokens per frame).
image_size = 512
# Max generated tokens for the caption. The model describes the scene in
# 1-3 sentences, so 64 is plenty and keeps latency low.
max_tokens = 64
# Threads for ONNX Runtime sessions. 0 = auto (ThreadBudget physical cores).
threads = 0

# ── TTS (Supertonic 3) ─────────────────────────────────────────────
[tts]
# Threads for ONNX Runtime sessions. The TTS runs alone (the LLM has
# already finished when it speaks), so it can safely use more cores than
# the shared AI budget. 0 = auto (ThreadBudget::computeThreads()).
threads = 0
# Default synthesis quality: "auto" (adaptive by text length, uses the
# steps_* tiers below), "low", "medium" or "high". On capable hardware you
# can pin "high" for maximum quality; absent/invalid falls back to "auto".
quality = "auto"
# Diffusion denoising steps per quality tier. Higher = better audio,
# slower generation; lower = faster but degraded. Auto resolves to Medium.
steps_low = 5
steps_medium = 8
steps_high = 10
# Base speech speed multiplier (0.7 slow .. 2.0 fast). 1.0 is the natural
# speaking pace; the request can still override this per call.
speed = 1.0
# Max characters per synthesis chunk. The model (flow-matching, offline) keeps
# stable quality up to ~30s of audio per forward: the duration predictor
# saturates at ~28.5s (~350-400 chars). A typical assistant reply (150-400
# chars) fits in ONE chunk -> no cuts, natural prosody. Chunking by sentence
# with 0.3s joins is the official SDK behaviour and only kicks in above this.
# No artificial silence is inserted between chunks.
max_chunk_len = 350

[storage.s3]
endpoint = ""
access_key = ""
secret_key = ""
region = ""
bucket = ""

# ── Local PKI (certificates & pairing) ───────────────────────────────────
# Generated by scripts/setup.sh into the cert dir. The CA is the instance
# identity (clients pin certs/ca.pem); the server leaf is short-lived and
# rotated automatically by CertService via drogon::reloadSSLFiles().
[cert]
dir = "certs"
ca_cert = "certs/ca.pem"
ca_key = "certs/ca.key"
server_cert = "certs/server.pem"
server_key = "certs/server.key"
# Leaf lifetime in days.
leaf_ttl_days = 90
# Rotate the leaf when fewer than this many days remain until expiry.
rotation_threshold_days = 30
# Interval in hours between automatic rotation checks (0 disables the timer).
rotate_check_hours = 24
# The pairing code is derived from the CA fingerprint (first 8 hex chars).
# Clients present it to POST /pairing once to fetch certs/ca.pem. If empty,
# CertService auto-derives it from the CA; setup.sh prints it on install.

# ── Pairing state ────────────────────────────────────────────────────────
# Whether a client has already completed pairing (one-time bootstrap).
# false → the server prints the pairing QR banner at startup and accepts
#         POST /pairing (onboarding). true → banner skipped, pairing rejected.
# ConfigService::setBool() writes this flag back to config.toml (in-memory +
# direct file write, comments preserved) the first time pairing succeeds.
[pairing]
paired = false

# ── mDNS/DNS-SD auto-discovery ──────────────────────────────────────────
# Publishes the backend on the local network so clients (mobile/web/desktop)
# can discover it without typing an IP address. Service is advertised as
# "<name>.<service_type>.local." on the default mDNS port 5353.
[mdns]
enabled = true
# Human-readable instance name; collisions are auto-renamed by mDNS.
name = "Argus"
# DNS-SD service type; the trailing ".local." is appended automatically.
service_type = "_argus._tcp"
# HTTPS port to advertise. MUST match [[drogon.listeners]] port.
port = 7024
# Arbitrary key/value metadata exposed in the DNS-SD TXT record.
[mdns.txt]
path = "/"
https = "true"
wss = "true"
