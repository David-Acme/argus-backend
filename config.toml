# ── Drogon HTTP(S) server config ─────────────────────────────────────────
# HTTPS-only: the listener serves TLS on the advertised mDNS port. The
# certificate pair is generated by scripts/setup.sh into certs/ (instance CA
# + server leaf). Clients must pin certs/ca.pem (see POST /pairing).

[[drogon.listeners]]
address = "0.0.0.0"
port = 7024
https = true
cert = "certs/server.pem"
key = "certs/server.key"
ssl_conf = [["MinProtocol", "TLSv1.2"]]

[[drogon.db_clients]]
name = "default"
rdbms = "sqlite3"
filename = "database/argus.db"
# Note: drogon's `is_fast` client mode exists for PostgreSQL/MySQL only;
# SQLite clients always use the shared pool. A single connection keeps the
# SQLite serialization cheap.
is_fast = false
number_of_connections = 1
timeout = -1.0

[drogon.app]
number_of_threads = 0
enable_session = false
document_root = "./"
upload_path = "uploads"
use_sendfile = true
use_gzip = true
use_brotli = false
static_files_cache_time = 5
idle_connection_timeout = 60
enable_server_header = true
enable_date_header = true
keepalive_requests = 0
pipelining_requests = 0
gzip_static = true
br_static = true
client_max_body_size = "60M"
client_max_memory_body_size = "16M"
client_max_websocket_message_size = "128K"
reuse_port = false
enabled_compressed_request = false
enable_request_stream = false
handle_sig_term = true
relaunch_on_error = false

[[drogon.plugins]]
name = "drogon::plugin::PromExporter"
dependencies = []
[drogon.plugins.config]
path = "/metrics"

[[drogon.plugins]]
name = "drogon::plugin::AccessLogger"
dependencies = []
[drogon.plugins.config]
use_spdlog = false
log_path = ""
log_format = ""
log_file = "access.log"
log_size_limit = 0
use_local_time = true
log_index = 0

[drogon.custom_config]

# ── Application settings ──────────────────────────────────────────────────

[jwt]
secret = "secret"
refresh_secret = "refresh_secret"
access_ttl_minutes = 15
refresh_ttl_days = 30

[database]
file = "./database/argus.db"

# ── Face recognition ──────────────────────────────────────────────────
[face]
detect_target = 640
score_threshold = 0.5
nms_threshold = 0.4
top_k = 5

# ── LLM (LFM2.5-1.2B-Instruct) ────────────────────────────────────
[llm]
# GGUF model file (LFM Open License v1.0, see models/llm/LICENSE.lfm1.0).
# LFM2.5-1.2B-Instruct has NO thinking/CoT mode: it replies directly and
# decisively, with better reasoning than the 350M sibling. ~36 tok/s CPU.
model_path = "models/llm/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
# Context window in tokens. Default 32768 (32k); can be raised up to 128000,
# the model's maximum (the clamp in llm-service.cc allows 4096..128000).
# Tradeoff of raising it: the f16 KV cache grows ~300 MB from 32k to 128k and
# decode gets marginally slower as the context fills — only worth it when
# [voice_test] history_messages keeps the history long enough to use it.
context_size = 32768
# Default max generated tokens per reply.
max_tokens = 256
# Sampling temperature. Higher = more varied, natural phrasing; too high
# degrades coherence. 0.85 tuned for the spoken conversation.
temperature = 0.85
# Temperature for turns that carry a recalled-memory block. Greedy 0.0 made
# the assistant sound robotic exactly on the turns where it used memory (the
# persona flipped between 0.85 and 0.0 turn by turn). Floor 0.5 keeps some
# variation while still damping the misattributions measured at 0.85.
recall_temperature = 0.5
# Threads for decode and prefill. 0 = auto (ThreadBudget).
threads = 0
batch_threads = 0
# Batch sizes (tokens). Prompts longer than n_batch are prefilled in chunks.
n_batch = 1024
n_ubatch = 512
# KV cache precision: "f16" | "q8_0" | "q4_0". LFM2.5 is a hybrid model where
# only 6 of 16 blocks carry attention, so quantising the cache saves very
# little memory while degrading exactly the layers that do long-range recall.
kv_type = "auto"
# "auto" | "on" | "off". Quantised V cache generally requires flash attention.
flash_attn = "auto"
# Full-size sliding-window cache. Only needed to reuse arbitrary positions.
swa_full = false
# Sampling. Order applied: penalties -> top_k -> top_p -> temp -> dist.
top_k = 20
top_p = 0.8
penalty_last_n = 64
penalty_repeat = 1.10
# Frequency penalty is subtracted as count * value; llama.h documents
# "0.0 = disabled" and the usable range is 0.0-0.7.
penalty_freq = 0.0
penalty_present = 0.0
# 0 = LLAMA_DEFAULT_SEED (varied output). Pin a value only for tests.
seed = 0
# "model" reads the template from the GGUF; "chatml" forces the fallback.
chat_template = "chatml"
# GPU layers to offload. -1 = decide from HardwareProfile, 0 = force CPU,
# N = offload N layers (999 = all). Only effective if llama.cpp was built with
# a GPU backend (Vulkan needs vulkan-headers + glslc + SPIRV-Headers).
# Measured on the reference iGPU (Radeon Vega, RADV): full offload gives
# +23% tok/s on short prompts, +58% on long ones, and -78% process RSS
# because the weights live in VRAM. Auto offloads whenever Vulkan exists.
gpu_layers = -1

# ── STT (FastConformer Transducer multilingual) ────────────────────────
[stt]
# Engine: "nemo_transducer" (FastConformer RNN-T, en+de+es+fr, RTF ~0.02,
# best speed/accuracy balance), "canary" (NeMo Canary 180m flash, same
# accuracy, 5x slower), "whisper" (tiny/base/small, auto language),
# "nemo_ctc" (CTC single-pass, fastest but weaker English), or
# "omnilingual" (1600 languages). Model files live in models/stt/.
engine = "nemo_transducer"
# Language code: "es", "en" or "auto".
# Voice interfaces can switch it at runtime via SttService::setLanguage().
language = "es"

# ── Vision (LiquidAI LFM2.5-VL-450M via llama.cpp + libmtmd) ───────
[vision]
# GGUF language model + multimodal projector. Downloaded by scripts/setup.sh
# (ARGUS_VLM_VARIANT=lfm25 by default). LFM Open License v1.0.
model_path = "models/vision/lfm2vl-25/lm-Q8_0.gguf"
mmproj_path = "models/vision/lfm2vl-25/mmproj-F16.gguf"
# Context window. The image alone costs 80-2300 tokens depending on input size.
context_size = 8192
# Max generated tokens for the caption.
max_tokens = 64
# Longest side the image is downscaled to before captioning. This is THE cost
# knob: LFM2.5-VL tiles dynamically, so the prompt grows with the input
# (256px -> 83 tokens -> ~720ms; 1280px -> 785 tokens -> ~3.1s). The pipeline
# feeds it a person crop, not the full frame, so 384 keeps detail and cost
# balanced. image_max_tokens caps per-tile detail instead, and below 256 the
# model stops reading text in the scene, so prefer this knob.
max_input_px = 384
# 0 = read the limit from the model metadata.
image_max_tokens = 0
# Default question when the caller does not supply one.
prompt = "Can you describe this image?"
# Captions are cached by (downscaled image, prompt) hash.
caption_cache_slots = 8
# Threads for llama.cpp. 0 = auto (ThreadBudget).
threads = 0
# GPU layers, same semantics as [llm] gpu_layers. Also drives mtmd use_gpu.
# Measured on the reference iGPU over 3 runs each: CPU 1453/999/1040 ms vs
# Vulkan 876/881/871 ms. Vulkan is ~16% faster on the median and, more
# importantly, collapses the spread from 454 ms to 10 ms — captioning becomes
# predictable, which matters more than the average for a real-time pipeline.
gpu_layers = -1

# ── TTS (Supertonic 3) ─────────────────────────────────────────────
[tts]
# Threads for ONNX Runtime sessions. The TTS runs alone (the LLM has
# already finished when it speaks), so it can safely use more cores than
# the shared AI budget. 0 = auto (ThreadBudget::computeThreads()).
threads = 0
# Default synthesis quality: "auto" (adaptive by text length, uses the
# steps_* tiers below), "low", "medium" or "high". On capable hardware you
# can pin "high" for maximum quality; absent/invalid falls back to "auto".
quality = "auto"
# Diffusion denoising steps per quality tier. Higher = better audio,
# slower generation; lower = faster but degraded. Auto never drops below
# Medium, and the hardware tier caps every tier from above.
steps_low = 6
steps_medium = 8
steps_high = 12
# Base speech speed multiplier (0.7 slow .. 2.0 fast). 1.0 is the natural
# speaking pace; the request can still override this per call.
speed = 1.0
# Max characters per synthesis chunk. The model (flow-matching, offline) keeps
# stable quality up to ~30s of audio per forward: the duration predictor
# saturates at ~28.5s (~350-400 chars). A typical assistant reply (150-400
# chars) fits in ONE chunk -> no cuts, natural prosody. Chunking by sentence
# with 0.3s joins is the official SDK behaviour and only kicks in above this.
# No artificial silence is inserted between chunks.
max_chunk_len = 350
# The model pads every synthesised chunk with 260-430 ms of silence at the head
# and 230-585 ms at the tail. Concatenating raw chunks stacked one chunk's tail
# onto the next chunk's head: measured 565 ms at the boundary, which the ear
# reads as "the assistant finished talking". Each chunk is now trimmed to
# edge_silence_ms at both ends and joined with join_silence_ms.
# Trimming the global head also makes the first word audible ~350 ms sooner,
# which is what the barge-in budget cares about.
edge_silence_ms = 40
join_silence_ms = 90

# ── Tapo camera local protocols ────────────────────────────────────
# Control channel (PTZ, presets, privacy, LED, day/night, motion,
# auto-track, detection history) speaks stok + securePassthrough over
# HTTPS with a self-signed certificate. The talk channel (TTS out to the
# camera speaker) speaks the proprietary 8800 protocol and needs the
# TP-Link cloud password, not the camera account.
[tapo]
control_port = 443
media_port = 8800
connect_timeout_ms = 3000
request_timeout_ms = 5000
login_attempts = 2
# "auto" probes securePassthrough first and falls back to legacy stok.
transport = "auto"
# Multipart body framing of the 8800 talk channel. "none" sends no
# Content-Length (pytapo/go2rtc behaviour); "negative" sends -1;
# "chunked" uses HTTP/1.1 chunked encoding. Settle with tapo-probe.
talk_framing = "none"
# Seconds without audio after which the camera cuts the voice session. Reopening
# it costs a full handshake, so it is kept open during the conversation and
# sendChunk only reopens it if sending fails.
talk_idle_timeout_s = 60
# Mic audio margin discarded after finishing the send to the speaker. The echo
# is discarded DURING the talk (the loop is blocked sending), so here only the
# camera speaker's playback queue + the mic capture delay are covered, not the
# phrase duration. Calibrate with labs/fixtures/camera-echo.wav: the moment the
# VAD probability drops back below neg_threshold after the sent audio ends.
talk_drain_margin_ms = 800
# Echo cancellation mode negotiated with the camera speaker.
talk_mode = "aec"
# Milliseconds of A-law audio per MPEG-TS part. Bounds the audio still in
# flight when a barge-in cancels the reply.
talk_packet_ms = 20

# ── Private object storage ──────────────────────────────────────────────
# `managed_local` is backed by the local RustFS compose service. Keep concrete
# endpoint, region and bucket values in config.local.toml so bridge/host
# deployments can choose their route without changing tracked configuration.
[storage]
mode = "managed_local"

# S3-compatible credentials stay blank in tracked configuration. The local
# bootstrap writes the endpoint, bucket, and restricted application credentials
# to the ignored config.local.toml.
[storage.s3]
endpoint = ""
access_key = ""
secret_key = ""
region = ""
bucket = ""

# ── Local PKI (certificates & pairing) ───────────────────────────────────
# Generated by scripts/setup.sh into the cert dir. The CA is the instance
# identity (clients pin certs/ca.pem); the server leaf is short-lived and
# rotated automatically by CertService via drogon::reloadSSLFiles().
[cert]
dir = "certs"
ca_cert = "certs/ca.pem"
ca_key = "certs/ca.key"
server_cert = "certs/server.pem"
server_key = "certs/server.key"
# Leaf lifetime in days.
leaf_ttl_days = 90
# Rotate the leaf when fewer than this many days remain until expiry.
rotation_threshold_days = 30
# Interval in hours between automatic rotation checks (0 disables the timer).
rotate_check_hours = 24
# The pairing code is derived from the CA fingerprint (first 8 hex chars).
# Clients present it to POST /pairing once to fetch certs/ca.pem. If empty,
# CertService auto-derives it from the CA; setup.sh prints it on install.

# ── Pairing state ────────────────────────────────────────────────────────
# Whether a client has already completed pairing (one-time bootstrap).
# false → the server prints the pairing QR banner at startup and accepts
#         POST /pairing (onboarding). true → banner skipped, pairing rejected.
# ConfigService::setBool() writes this flag back to config.toml (in-memory +
# direct file write, comments preserved) the first time pairing succeeds.
[pairing]
paired = true

# ── mDNS/DNS-SD auto-discovery ──────────────────────────────────────────
# Publishes the backend on the local network so clients (mobile/web/desktop)
# can discover it without typing an IP address. Service is advertised as
# "<name>.<service_type>.local." on the default mDNS port 5353.
[mdns]
enabled = true
# Human-readable instance name; collisions are auto-renamed by mDNS.
name = "Argus"
# DNS-SD service type; the trailing ".local." is appended automatically.
service_type = "_argus._tcp"
# HTTPS port to advertise. MUST match [[drogon.listeners]] port.
port = 7024
# Arbitrary key/value metadata exposed in the DNS-SD TXT record.
[mdns.txt]
path = "/"
https = "true"
wss = "true"

# ── Media streaming (go2rtc as internal ingest) ────────────────────
# go2rtc runs on loopback only and is never exposed. All client traffic goes
# through the backend's own HTTPS port so it behaves identically on the LAN and
# through the tunnel that will proxy to the cloud when the user is away.
[streaming]
go2rtc_bin = "third_party/go2rtc/go2rtc"
go2rtc_config = "go2rtc.yaml"
go2rtc_api = "127.0.0.1:1984"
go2rtc_rtsp = "127.0.0.1:8554"
# Restart attempts before the camera is marked offline instead of looping.
max_restarts = 8
# Video bytes in flight allowed per CONNECTION (not per subscription): the
# bottleneck is the TCP socket, shared by all the cameras a client watches.
hub_window_bytes = 131072
# Maximum chunk per binary message. Bounds how much a single fragment can
# monopolize the socket and leaves room for audio and control JSON.
hub_chunk_bytes = 16384
# Seconds the upstream stays open after the last viewer leaves.
hub_grace_ms = 2000
# Simultaneous cameras per client. The preview grid marks the minimum.
hub_max_subs_per_client = 8

# ── Voice detection (Silero VAD v5) ─────────────────────────────────
# The camera microphone is far-field and noisier than a headset one, so the
# start threshold is low and the turn-quality gate filters the false
# positives, not the threshold.
[vad]
threshold = 0.45
neg_threshold = 0.25
# 32 ms speech windows to open a turn.
min_speech_frames = 5
# 32 ms silence windows to close it. 12 = 384 ms: below 300 ms Spanish
# sentences get split at the pause between phrases.
min_silence_frames = 12
# Hard cap of a turn (750 windows = 24 s).
max_turn_frames = 750
# Windows saved before the detected start so the initial phoneme is not cut.
# 10 = 320 ms.
pre_roll_frames = 10
# Quality gate: below this the turn is discarded without calling the STT. The
# STT makes up phrases when it gets short or nearly silent audio.
min_turn_ms = 240
min_mean_prob = 0.35
# RNNoise noise suppression before the VAD: strips background noise so only
# the speaker's voice opens a turn (and the STT only ever sees clean audio).
denoise = true
# Performance gate: batches whose RMS stays below this (≈ -49 dBFS, pure
# silence) skip the whole RNNoise path until speech or stronger noise shows
# up. Keeps idle CPU usage near zero while nobody is talking.
denoise_gate_rms = 0.0035

# ── Voice test (labs) ────────────────────────────────────────────────
# Camera credentials live in config.local.toml (untracked overlay); this block
# only carries lab tunables.
[voice_test]
# Max wait without mic audio before forcing a reconnect. Without it,
# av_read_frame can get stuck when the camera stops sending (RTCP keepalives
# stop rw_timeout from firing) and the mic goes deaf. FFmpeg's
# interrupt_callback aborts the read past this deadline and the reconnect loop
# reopens the session in seconds.
mic_recover_timeout_ms = 3000
# History messages kept in the conversation (not counting the system prompt).
# Pruning below this breaks the LLM's prefix reuse and every turn re-prefills
# everything; 41 = 20 turns of memory. If you raise llm.context_size toward
# 128000, you can also raise this cap for even longer conversations.
history_messages = 41

# ── Long-term memory (MemoryService) ─────────────────────────────────────
# Hybrid recall: FTS5 (unicode61 + trigram) + vec0 (ONNX embeddings
# multilingual-e5-small int8, models/memory/). Lexical-only recall if the
# model is missing.
[memory]
# Per-turn token budget: recalled memories (prepended to the user message)
# and the stable profile (appended to the system prompt). Raising them
# improves context at the cost of prefill tokens.
recall_max_tokens = 512
profile_max_tokens = 256
# Max persona facts injected at conversation start (the profile is a
# compact selection, never a dump: a small model chokes on 8+ facts).
profile_max_facts = 4
# Relative relevance margin: memories scoring below this fraction of the
# best hit are dropped (near-misses sharing only a common verb like
# "gusta" used to be injected and misattributed).
# Seconds before the stable profile cache (memory_profile) is rebuilt from
# the persona-type memories (selection by priority/hit_count/recency).
profile_stale_seconds = 300
# Recall deadline inside a voice turn (ms, 0 = no deadline). When the turn
# exceeds the budget, the lexical layer answers and the semantic layer is
# reserved for the next turn (the model is already warm by then).
recall_deadline_ms = 200
# Embedding model (multilingual-e5-small int8, downloaded by setup.sh).
# Loaded lazily on the first real embed (in the worker), never at server
# boot. Without the model the recall is lexical only (bm25 + trigram) —
# graceful degradation.
embedding_model = "models/memory/model.onnx"
embedding_tokenizer = "models/memory/tokenizer.json"
embedding_max_len = 512
# Load the embedding model at boot instead of on the first embed. The lazy
# path stalls the first turn that needs a vector (~800 ms on the reference
# machine); preloading moves that cost to startup, where it is invisible.
embedding_preload = true
# Effective vector dimension stored in vec0 (post-pooling truncation, 0 =
# model dimension, 384). Lower values speed up KNN and shrink storage.
embedding_dim = 0
# Max memories injected per turn.
recall_top_k = 4
# Lexical evidence threshold for skipping the vector layer (fast path): when
# the FTS layers produce >= N candidates, the embedding forward is skipped
# and recall answers in <5 ms instead of ~25-60 ms.
lexical_min_hits = 4
# Cosine floor for the semantic recall tier (0 = disabled). e5 compresses
# cosines: unrelated pairs sit around 0.76, related ones at 0.85+, so 0.80
# cuts the noise without discarding legitimate paraphrases (the old 0.84-0.90
# gate did). The tier runs only when the entity and lexical tiers return
# fewer than lexical_min_hits facts.
vector_min_sim = 0.80
# How far above the background a fact must stand to be recalled semantically.
# e5 scores any two Spanish sentences at 0.75-0.85, so the absolute value says
# almost nothing: "hola, ¿cómo estás?" peaks at 0.850 against a completely
# unrelated fact, higher than "¿cuál es la clave del wifi?" at 0.862 against
# its own. What separates them is the shape: smalltalk is equidistant from
# everything (margin 0.013-0.031), a real question makes one fact stand out
# (margin 0.076-0.101). 0.05 sits in that gap.
vector_margin = 0.05
# With fewer than two stored facts there is no background to measure, so the
# semantic tier falls back to this stricter absolute floor. It sits high on
# purpose: on a nearly empty store a weak neighbour is the only candidate, and
# the model turns it into an invented link ("tu sobrino estaba asustado porque
# el router...") instead of admitting it does not know.
vector_strict_min_sim = 0.88
# Floor used when the store holds exactly 2 distinct facts (1 keeps
# vector_strict_min_sim): the leave-one-out mean would otherwise drop both
# related facts, and a missed recall is cheaper than a tiny-store invention.
vector_small_store_sim = 0.84
# Facts the semantic tier may add per turn. Recall stays demand-driven: the
# turn gets what stands out, not the whole memory.
semantic_max_facts = 2
# Minimum cosine similarity ("passage:") to merge a semantic duplicate
# detected by the worker: bump priority/hit_count on the existing memory and
# discard the newly captured one. e5 puts same-fact paraphrases around
# 0.93-0.96 and genuinely different memories below 0.90, so 0.93 catches
# duplicates without merging distinct facts.
vector_dedup_sim = 0.93
# Chunk size (chars) for long contents: above it the content is split into
# sentences with overlap and each chunk is embedded separately (same
# memory_id) so the tail is not truncated by the tokenizer.
chunk_chars = 400
# Drain timeout of the async queue when closing a session (ms). The session
# summary runs the main LLM in the background and can take seconds.
flush_timeout_ms = 60000
# Budget when CLOSING an interactive session. The worker keeps draining after
# this (it finishes its queue before exiting), so a long wait here only makes
# Ctrl+C feel broken.
exit_flush_ms = 4000
# ── Conversation compaction (main LLM, no extra model) ──────────────────
# When the conversation history exceeds its cap, the oldest turns are NOT
# discarded: they are compacted in the background with the SAME LlmService
# (dedicated prompt, reset context) and the summary is saved as episodic
# memory (L2). If the LLM is busy generating, the worker waits up to
# compact_wait_ms before retrying (it never steals a live turn: it only
# runs when the LLM is idle).
compact_wait_ms = 15000
compact_max_tokens = 256
# Implicit captures (fastText hint, no explicit trigger) are deferred as idle
# work: the worker waits up to extract_wait_ms for the LLM to go quiet and
# re-enqueues instead of competing with the spoken answer.
extract_wait_ms = 15000
# Native tool-call markers for saving memories during generation. The normal
# dialogue never announces tools; these stay for labs/tool-bench and probes.
save_trigger = "<|tool_call_start|>"
# Closing marker of the tool-call.
tool_end_trigger = "<|tool_call_end|>"

# Implicit tool intents (fastText supervised, models/intent/).
# The model is trained and recalibrated with labs/intent-probe:
#   argus-intent-probe --intent-train && argus-intent-probe --intent-check
# Without the model, tools fall back to the literal trigger (mentionsCamera).
[intent]
# fastText model (fp32 .bin or quantized .ftz) trained with softmax + none.
# The .ftz is the runtime (0.6 MB, p50 ~13 us); the .bin is regenerated on
# every --intent-train and serves as reference for --intent-quantize.
model = "models/intent/argus-intent.ftz"
# Minimum probability (softmax) to trigger each tool. The check set leaves a
# wide margin (positives >= 0.96, negatives <= 0.35): 0.60 prioritizes
# precision. Recalibrate with --intent-check if intents are added.
camera_threshold = 0.60
memory_save_threshold = 0.60
# An intent also has to WIN over the other classes (including `none`) by this
# margin. The threshold alone is not enough: the model is one-vs-all, so
# memory_save 0.95 can coexist with none 0.98. STT text has no accents and no
# punctuation, so the classifier stays a hint — precision comes from the
# margin plus the deterministic RuleParser barrier in MemoryService.
margin = 0.20
# Real usage log (TSV: intent\ttext) that voice-test writes when an intent
# fires. --intent-train --include-usage merges it when retraining, so the
# model learns from the cases the user actually sees.
usage_log = "labs/intent-data/usage.tsv"


[extract]
# Structured memory extraction. The model is
# optional: absence degrades to the Minimal tier (lexicon only, 0 MB) and
# never fails boot. Downloaded by scripts/setup.sh into models/extract/.
model_path = "models/extract/NuExtract-1.5-tiny-Q4_K_M.gguf"
# Prompt dialect of the extraction model: "v1.5" (NuExtract 1.5 family,
# <|input|>/<|output|> markers), "v2" (NuExtract 2.0, ChatML with a
# "# Template:" prefix) or "lfm" (LFM2-Extract family, ChatML with the schema
# in the system turn). They are NOT interchangeable: the wrong dialect makes
# the model echo the input instead of extracting.
prompt_format = "v1.5"
# auto | full | light | minimal — overrides HardwareProbe::extractionTier()
tier = "auto"
# -1 = HardwareProbe::llmGpuLayers() (0 unless Vulkan + >= 8 GB RAM)
gpu_layers = -1
# Fraction of the utterance the lexicon has to account for before its result
# is trusted. Below it the sentence carried more than the lexicon understood
# ("mira una cosa, el sabado viene mi hermana" matched only a fragment), so the
# model tier decides instead. The escalation is free for the conversation:
# extraction already runs off the turn.
lexicon_min_coverage = 0.6
# 0 = ThreadBudget::extractionThreads()
threads = 0
n_ctx = 2048
max_tokens = 512
# Unloads the model after this many seconds without extraction jobs.
idle_unload_seconds = 600
