worker_processes 1;
pid /tmp/argus-livekit-tls.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

stream {
    server {
        listen 7046 ssl;
        ssl_certificate /etc/argus/certs/server.pem;
        ssl_certificate_key /etc/argus/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:livekit:1m;
        proxy_pass 127.0.0.1:7880;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
