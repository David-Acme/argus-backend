name: argus-cutover

# Cutover deployment stack (Fase 6, compose v7): the legacy service and the
# RustFS storage pair are retired — the gateway is the only public surface
# and every domain is served by its own argus-cutover service, with the
# argus-voice pure-gRPC cutover (argus.voice.v1 on 7034, /health on 7035)
# and the gateway identity RPC the spoken-name write goes through.

services:
  gateway:
    build:
      context: ..
      dockerfile: argus-deploy/Dockerfile
      args:
        ARGUS_UID: "${ARGUS_UID:-1000}"
        ARGUS_GID: "${ARGUS_GID:-1000}"
    image: argus-cutover:local
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: host
    entrypoint: ["/opt/argus/argus-gateway"]
    volumes:
      - type: bind
        source: ./config.gateway.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../certs
        target: /opt/argus/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - productivity-db:/opt/argus/productivity
      - notification-db:/opt/argus/notification
      - type: bind
        source: ../models
        target: /opt/argus/models
        read_only: true
        bind:
          create_host_path: false
    # The NatsBus connects once at boot with no retry: without this gate a
    # lost boot race silently drops every fan-out subscription (all green
    # healthchecks, zero events consumed).
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfs https://127.0.0.1:7024/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_GATEWAY_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_GATEWAY_CPU_LIMIT:-2.00}"
    pids_limit: 512
    restart: unless-stopped

  # Camera-domain service (Fase 2 cutover, Rulings X/Y/Z): owns camera.db, the
  # /camera+/zone CRUD surface, the camera:* sync frames and the go2rtc it
  # spawns itself (Ruling AH). Internal network only; the gateway reaches it
  # through the loopback-published 7026 HTTP listener and the 7036
  # argus.camera.v1 sync leg. /dev/dri engages the
  # RADV detector (Ruling AI): a host without /dev/dri must drop this device
  # line via a compose override — `devices: !override []` (a plain `[]` merge
  # silently keeps the device) — and the detector then degrades to CPU
  # in-binary.
  argus-camera:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-camera
    ports:
      - "127.0.0.1:${CAMERA_PORT:-7026}:7026"
      # argus.camera.v1 SyncService leg the gateway pulls the camera sync
      # tables from.
      - "127.0.0.1:${CAMERA_GRPC_PORT:-7036}:7036"
    devices:
      - /dev/dri:/dev/dri
    entrypoint: ["/opt/argus/argus-camera"]
    volumes:
      - type: bind
        source: ./config.camera.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
      - camera-stream:/opt/argus/stream
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - type: bind
        source: ../models
        target: /opt/argus/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../third_party/go2rtc
        target: /opt/argus/third_party/go2rtc
        read_only: true
        bind:
          create_host_path: false
    # The gateway pulls the camera sync tables over the 7036 gRPC leg once
    # this service is up; this service validates its callers over the
    # gateway's identity RPC (7040) and still opens identity.db read-only for
    # its sync socket's user reads (bounded wait — the gateway creates it at
    # ITS boot), so both boot in parallel after nats with no circular health
    # dependency.
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7026/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_CAMERA_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_CAMERA_CPU_LIMIT:-2.00}"
    pids_limit: 512
    restart: unless-stopped

  # Productivity-domain service (Fase 3 cutover, Rulings AP/AQ/AT): owns
  # productivity.db (reminder, project, project_task, calendar_event,
  # project_member, calendar_event_share, reminder_detail), serves the five
  # productivity route prefixes the gateway proxies to it, and publishes its
  # change events to the gateway over NATS. Its only host exposure is the
  # loopback-published 7027 listener. Its JWT filter validates over the
  # gateway's identity RPC (7040); it still opens identity.db read-only for
  # the share/member target validation (Ruling AM), so it mounts the same
  # data dir the gateway writes.
  argus-productivity:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-productivity
    ports:
      - "127.0.0.1:${PRODUCTIVITY_PORT:-7027}:7027"
    entrypoint: ["/opt/argus/argus-productivity"]
    volumes:
      - type: bind
        source: ./config.productivity.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - productivity-db:/opt/argus/productivity
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7027/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_PRODUCTIVITY_MEMORY_LIMIT:-1g}"
    cpus: "${ARGUS_PRODUCTIVITY_CPU_LIMIT:-1.00}"
    pids_limit: 512
    restart: unless-stopped

  # Notification-domain service (Fase 3 cutover, Rulings AP/AR/AT): owns
  # notification.db as the single notification substrate, serves the
  # /notification and /notification-token write paths the gateway proxies to
  # it. Same NATS/data-dir shape as argus-productivity, but no identity.db of
  # its own — its filters validate over the gateway's identity RPC (7040).
  # The gateway ALSO opens notification.db read-write here (its
  # camera-notifier writes), which is why the volume is rw in both.
  argus-notification:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-notification
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-7028}:7028"
    entrypoint: ["/opt/argus/argus-notification"]
    volumes:
      - type: bind
        source: ./config.notification.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - notification-db:/opt/argus/notification
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7028/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_NOTIFICATION_MEMORY_LIMIT:-1g}"
    cpus: "${ARGUS_NOTIFICATION_CPU_LIMIT:-1.00}"
    pids_limit: 512
    restart: unless-stopped

  # AI engine services (Fase 4): internal-wire RPC servers; the config
  # remote_url gates dial the loopback publishes (Rulings CB/CC/CD).
  argus-tts:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-tts
        ipv4_address: 172.19.0.29
    ports:
      - "127.0.0.1:${TTS_PORT:-7029}:7029"
    entrypoint: ["/opt/argus/argus-tts"]
    volumes:
      - type: bind
        source: ./config.tts.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/tts
        target: /opt/argus/models/tts
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7029/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_TTS_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_TTS_CPU_LIMIT:-1.50}"
    pids_limit: 512
    restart: unless-stopped

  argus-stt:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-stt
        ipv4_address: 172.19.0.30
    ports:
      - "127.0.0.1:${STT_PORT:-7030}:7030"
    entrypoint: ["/opt/argus/argus-stt"]
    volumes:
      - type: bind
        source: ./config.stt.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/stt
        target: /opt/argus/models/stt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7030/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_STT_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_STT_CPU_LIMIT:-1.50}"
    pids_limit: 512
    restart: unless-stopped

  # /dev/dri enables the Vulkan backend; a GPU-less host drops it via
  # `devices: !override []` and the engine degrades to CPU (Ruling CD).
  argus-vlm:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-vlm
        ipv4_address: 172.19.0.31
    ports:
      - "127.0.0.1:${VLM_PORT:-7031}:7031"
    devices:
      - /dev/dri:/dev/dri
    entrypoint: ["/opt/argus/argus-vlm"]
    volumes:
      - type: bind
        source: ./config.vlm.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/vision
        target: /opt/argus/models/vision
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7031/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_VLM_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_VLM_CPU_LIMIT:-2.00}"
    pids_limit: 512
    restart: unless-stopped

  argus-llm:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-llm
        ipv4_address: 172.19.0.32
    ports:
      - "127.0.0.1:${LLM_PORT:-7032}:7032"
    entrypoint: ["/opt/argus/argus-llm"]
    volumes:
      - type: bind
        source: ./config.llm.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/llm
        target: /opt/argus/models/llm
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7032/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_LLM_MEMORY_LIMIT:-4g}"
    cpus: "${ARGUS_LLM_CPU_LIMIT:-2.50}"
    pids_limit: 512
    restart: unless-stopped

  # Memory service (F4-6): single owner of the memory.db volume; the only AI
  # service with a bus consumer, hence gated on nats (Rulings CB/CC).
  argus-memory:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-memory
        ipv4_address: 172.19.0.33
    ports:
      - "127.0.0.1:${MEMORY_PORT:-7033}:7033"
    entrypoint: ["/opt/argus/argus-memory"]
    volumes:
      - type: bind
        source: ./config.memory.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - memory-db:/opt/argus/memory
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      # The schema SQL ships with the repo — bind it over the data-dir path so
      # [memory] schema_file always resolves (same pattern as the init
      # services).
      - type: bind
        source: ../database/memory-schema.sql
        target: /opt/argus/database/memory-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
      - type: bind
        source: ../models/memory
        target: /opt/argus/models/memory
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/extract
        target: /opt/argus/models/extract
        read_only: true
        bind:
          create_host_path: false
    # argus-memory's worker chat dials argus-llm by IPv4 literal (the
    # raw-socket client resolves literals only), which is why the AI services
    # carry static addresses on the internal subnet.
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7033/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_MEMORY_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_MEMORY_CPU_LIMIT:-1.50}"
    pids_limit: 512
    restart: unless-stopped

  # Voice-orchestration service (F6-3 v2 cutover, the pure-gRPC pilot): owns
  # the voice session (VAD → STT → LLM → TTS) and serves argus.voice.v1 on
  # its gRPC listener; the gateway relays the frozen /sync voice wire to it.
  # STT/TTS/LLM are remote ([stt]/[tts]/[llm] point at argus-stt/tts/llm) and
  # the spoken-name write is the typed UpdateUser RPC to the gateway, so it
  # mounts no databases — only the in-process silero VAD model.
  argus-voice:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-voice
        ipv4_address: 172.19.0.34
    ports:
      - "127.0.0.1:${VOICE_PORT:-7034}:7034"
      - "127.0.0.1:${VOICE_HEALTH_PORT:-7035}:7035"
    entrypoint: ["/opt/argus/argus-voice"]
    volumes:
      - type: bind
        source: ./config.voice.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../models/vad
        target: /opt/argus/models/vad
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7035/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_VOICE_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_VOICE_CPU_LIMIT:-2.00}"
    pids_limit: 512
    restart: unless-stopped

  # Tunnel relay (Fase 5, Rulings CF/CI/CL): the device-facing entry point of
  # the byte-transparent transport. Standalone-deployable: lift this block
  # (plus its config.relay.toml and the argus-cutover image) onto a US server
  # unchanged — it needs no other service unless [push] intents are wanted.
  # Opt-in via the "tunnel" profile so the default stack stays the v4 shape;
  # an empty [tunnel] secret refuses to boot, which keeps it off until the
  # instance config is filled.
  argus-relay:
    profiles: ["tunnel"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-relay
    ports:
      - "127.0.0.1:${RELAY_DEVICE_PORT:-7100}:7100"
      - "127.0.0.1:${RELAY_HOME_PORT:-7101}:7101"
      - "127.0.0.1:${RELAY_HEALTH_PORT:-7103}:7103"
    entrypoint: ["/opt/argus/argus-tunnel-relay"]
    volumes:
      - type: bind
        source: ./config.relay.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7103/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: "${ARGUS_RELAY_MEMORY_LIMIT:-256m}"
    cpus: "${ARGUS_RELAY_CPU_LIMIT:-0.50}"
    pids_limit: 128
    restart: unless-stopped

  # Tunnel client (Fase 5): the home-side half of the transport. Host-networked
  # like the gateway (transitional Ruling O exception) so it dials the
  # gateway's [remote] tunnel_port and the relay's loopback-published home
  # listener on 127.0.0.1. Same "tunnel" profile as the relay.
  argus-tunnel-client:
    profiles: ["tunnel"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: host
    entrypoint: ["/opt/argus/argus-tunnel-client"]
    volumes:
      - type: bind
        source: ./config.tunnel.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      gateway:
        condition: service_started
      argus-relay:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7104/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: "${ARGUS_TUNNEL_CLIENT_MEMORY_LIMIT:-256m}"
    cpus: "${ARGUS_TUNNEL_CLIENT_CPU_LIMIT:-0.50}"
    pids_limit: 128
    restart: unless-stopped

  nats:
    image: nats:2.11.14-alpine
    command: ["-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    networks:
      internal:
        aliases:
          - nats
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: "${NATS_MEMORY_LIMIT:-256m}"
    restart: unless-stopped

  identity-init:
    profiles: ["identity-init"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ -f /opt/argus/database/argus.db ]; then /opt/argus/argus-migrate-identity --source /opt/argus/database/argus.db --target /opt/argus/database/identity.db --schema /opt/argus/database/identity-schema.sql; else echo 'No argus.db yet; the gateway creates identity.db at boot.'; fi
    volumes:
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      # The schema SQL ships with the repo, not with every provisioned data
      # dir — bind it into the data-dir path so --schema always resolves.
      - type: bind
        source: ../argus-identity/database/schema.sql
        target: /opt/argus/database/identity-schema.sql
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  # Camera migration init (Ruling AG): opt-in one-shot tool copying the camera
  # tables from argus.db onto the camera.db volume. Idempotent no-op on a
  # schema-current target; run it with the stack stopped so the tool does not
  # race argus-camera on camera.db, and BEFORE the first boot (once
  # argus-camera has applied the camera schema the target is live data and
  # the tool refuses to resurrect argus.db rows over it).
  camera-init:
    profiles: ["camera-init"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ -f /opt/argus/database/argus.db ]; then /opt/argus/argus-migrate-camera --source /opt/argus/database/argus.db --target /opt/argus/camera/camera.db --schema /opt/argus/database/camera-schema.sql; else echo 'No argus.db yet; argus-camera applies the camera schema at boot.'; fi
    volumes:
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      # Same repo-shipped schema bind as identity-init: a provisioned data
      # dir without the SQL would fail "schema file not found".
      - type: bind
        source: ../database/camera-schema.sql
        target: /opt/argus/database/camera-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
    restart: "no"

  # Productivity migration init (Ruling AU): opt-in one-shot tool copying the
  # 7 productivity tables from argus.db onto the productivity.db volume.
  # Idempotent no-op on a schema-current target; run it with the stack stopped
  # and BEFORE the first boot — once argus-productivity has applied the
  # productivity schema the target is live data and the tool correctly no-ops
  # instead of resurrecting argus.db rows over it (the f8291e4 ordering
  # lesson, same as camera-init).
  productivity-init:
    profiles: ["productivity-init"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ -f /opt/argus/database/argus.db ]; then /opt/argus/argus-migrate-productivity --source /opt/argus/database/argus.db --target /opt/argus/productivity/productivity.db --schema /opt/argus/database/productivity-schema.sql; else echo 'No argus.db yet; argus-productivity applies the productivity schema at boot.'; fi
    volumes:
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      # Same repo-shipped schema bind as the other init services: a
      # provisioned data dir without the SQL would fail "schema file not
      # found".
      - type: bind
        source: ../database/productivity-schema.sql
        target: /opt/argus/database/productivity-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - productivity-db:/opt/argus/productivity
    restart: "no"

  # Notification migration init (Ruling AU): opt-in one-shot tool copying
  # notification + notification_token from argus.db onto the notification.db
  # volume. Same before-first-boot rule as productivity-init.
  notification-init:
    profiles: ["notification-init"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ -f /opt/argus/database/argus.db ]; then /opt/argus/argus-migrate-notification --source /opt/argus/database/argus.db --target /opt/argus/notification/notification.db --schema /opt/argus/database/notification-schema.sql; else echo 'No argus.db yet; argus-notification applies the notification schema at boot.'; fi
    volumes:
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - type: bind
        source: ../database/notification-schema.sql
        target: /opt/argus/database/notification-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - notification-db:/opt/argus/notification
    restart: "no"

  # RADV validation probe (Fase 2 gate): runs argus-vulkan-probe against the
  # host GPU with /dev/dri mounted. Opt-in because a host without /dev/dri
  # fails the device attach (or drops it with `devices: !override []`, which
  # then exercises the same llvmpipe degradation argus-camera would see).
  # Hosts with restrictive device ACLs may need to add their host
  # video/render group gid via group_add.
  vulkan-probe:
    profiles: ["vulkan-probe"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/opt/argus/argus-vulkan-probe"]
    devices:
      - /dev/dri:/dev/dri
    restart: "no"

volumes:
  camera-db:
    name: argus-cutover-camera-db
  camera-stream:
    name: argus-cutover-camera-stream
  productivity-db:
    name: argus-cutover-productivity-db
  notification-db:
    name: argus-cutover-notification-db
  memory-db:
    name: argus-cutover-memory-db

networks:
  internal:
    name: argus-cutover-internal
    # Pinned subnet: static AI-service IPv4s (raw-socket wires resolve
    # literals only) and a stable 172.19.0.1 relay source for trusted-proxy
    # checks.
    ipam:
      config:
        - subnet: 172.19.0.0/24
