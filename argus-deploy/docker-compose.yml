name: argus-cutover

# Cutover stack (Fase 2): gateway (public TLS 7024) + legacy (internal 7025) +
# argus-camera (internal, 7026) + nats + rustfs, with the identity and camera
# migration init tools and the opt-in RADV vulkan-probe validation service.
# The root docker-compose.yml stays the dev tooling; this file is the
# deployment stack.
#
# Transitional network shape (Ruling O exception): the legacy keeps host
# networking for go2rtc/RTSP/mDNS camera discovery and the Tapo 8800 LAN talk
# listener, and only binds 127.0.0.1:7025 (it trusts X-Forwarded-For from
# loopback peers only), so the gateway is also host-networked to reach it as
# 127.0.0.1. Only the gateway binds a public port. argus-camera runs on the
# internal bridge network and publishes ONLY its 7026 listener on host
# loopback for the host-networked gateway; its go2rtc (1984/8554) stays inside
# the container (Ruling AH). The docker-proxy peer address the camera sees is
# the internal network's gateway IP, so the camera config must list it in
# device.trusted_proxy_ips (transitional until the internal identity headers
# replace the forwarded-for trust). nats and rustfs live on the internal
# bridge network, published on host loopback for the host-networked services.

services:
  gateway:
    build:
      context: ..
      dockerfile: argus-deploy/Dockerfile
      args:
        ARGUS_UID: "${ARGUS_UID:-1000}"
        ARGUS_GID: "${ARGUS_GID:-1000}"
    image: argus-cutover:local
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: host
    entrypoint: ["/opt/argus/argus-gateway"]
    volumes:
      - type: bind
        source: ./config.gateway.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../certs
        target: /opt/argus/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
      - type: bind
        source: ../models
        target: /opt/argus/models
        read_only: true
        bind:
          create_host_path: false
    # The NatsBus connects once at boot with no retry: without this gate a
    # lost boot race silently drops every fan-out subscription (all green
    # healthchecks, zero events consumed).
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfs https://127.0.0.1:7024/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_GATEWAY_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_GATEWAY_CPU_LIMIT:-2.00}"
    pids_limit: 512
    restart: unless-stopped

  legacy:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: host
    entrypoint: ["/opt/argus/argus-backend"]
    volumes:
      - type: bind
        source: ./config.legacy.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../certs
        target: /opt/argus/certs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
      - type: bind
        source: ../models
        target: /opt/argus/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../third_party/go2rtc
        target: /opt/argus/third_party/go2rtc
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      gateway:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7025"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: "${ARGUS_BACKEND_MEMORY_LIMIT:-6g}"
    cpus: "${ARGUS_BACKEND_CPU_LIMIT:-4.00}"
    pids_limit: 1024
    restart: unless-stopped

  # Camera-domain service (Fase 2 cutover, Rulings X/Y/Z): owns camera.db, the
  # /camera+/zone CRUD surface, the camera:* sync frames and the go2rtc it
  # spawns itself (Ruling AH). Internal network only; the gateway reaches it
  # through the single loopback-published 7026 listener. /dev/dri engages the
  # RADV detector (Ruling AI): a host without /dev/dri must drop this device
  # line via a compose override — `devices: !override []` (a plain `[]` merge
  # silently keeps the device) — and the detector then degrades to CPU
  # in-binary.
  argus-camera:
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    networks:
      internal:
        aliases:
          - argus-camera
    ports:
      - "127.0.0.1:${CAMERA_PORT:-7026}:7026"
    devices:
      - /dev/dri:/dev/dri
    entrypoint: ["/opt/argus/argus-camera"]
    volumes:
      - type: bind
        source: ./config.camera.toml
        target: /opt/argus/config.toml
        read_only: true
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
      - camera-stream:/opt/argus/stream
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      - type: bind
        source: ../models
        target: /opt/argus/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../third_party/go2rtc
        target: /opt/argus/third_party/go2rtc
        read_only: true
        bind:
          create_host_path: false
    # The gateway opens camera.db read-only at boot once argus-camera's schema
    # apply has created it (bounded wait inside the gateway, see its main);
    # identity.db is created by the gateway at ITS boot, and argus-camera
    # waits bounded for it the same way — so both services boot in parallel
    # after nats with no circular health dependency.
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7026/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: "${ARGUS_CAMERA_MEMORY_LIMIT:-2g}"
    cpus: "${ARGUS_CAMERA_CPU_LIMIT:-2.00}"
    pids_limit: 512
    restart: unless-stopped

  nats:
    image: nats:2.11.14-alpine
    command: ["-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    networks:
      internal:
        aliases:
          - nats
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: "${NATS_MEMORY_LIMIT:-256m}"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    networks:
      internal:
        aliases:
          - rustfs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: "${RUSTFS_MEMORY_LIMIT:-512m}"
    cpus: "${RUSTFS_CPU_LIMIT:-1.00}"
    pids_limit: 128
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc:v0.1.31
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        bucket="$$(tr -d '\r\n' < "$${RUSTFS_BUCKET_FILE}")"; test -n "$${bucket}"; access_key="$$(tr -d '\r\n' < /run/secrets/rustfs_access_key)"; secret_key="$$(tr -d '\r\n' < /run/secrets/rustfs_secret_key)"; app_access_key="$$(tr -d '\r\n' < /run/secrets/argus_s3_access_key)"; app_secret_key="$$(tr -d '\r\n' < /run/secrets/argus_s3_secret_key)"; /usr/bin/rc alias set argus "$${RUSTFS_ENDPOINT}" "$${access_key}" "$${secret_key}" --region "$${RUSTFS_REGION}" --bucket-lookup path >/dev/null; /usr/bin/rc bucket create "argus/$${bucket}" --ignore-existing >/dev/null; if /usr/bin/rc admin service-account info argus "$${app_access_key}" >/dev/null 2>&1; then /usr/bin/rc admin service-account update argus "$${app_access_key}" --secret-key "$${app_secret_key}" --name argus-backend --description "Argus private object storage" --policy /run/argus/rustfs-policy.json >/dev/null; else /usr/bin/rc admin service-account create argus "$${app_access_key}" "$${app_secret_key}" --name argus-backend --description "Argus private object storage" --policy /run/argus/rustfs-policy.json >/dev/null; fi; /usr/bin/rc admin service-account info argus "$${app_access_key}" >/dev/null; echo 'RustFS private bucket and application service account are ready.'
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: "${RUSTFS_REGION:-us-east-1}"
      RUSTFS_BUCKET_FILE: /run/argus/rustfs-bucket
    volumes:
      - ../docker/runtime/rustfs-bucket:/run/argus/rustfs-bucket:ro
      - ../docker/runtime/rustfs-policy.json:/run/argus/rustfs-policy.json:ro
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
      - argus_s3_access_key
      - argus_s3_secret_key
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  identity-init:
    profiles: ["identity-init"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ -f /opt/argus/database/argus.db ]; then /opt/argus/argus-migrate-identity --source /opt/argus/database/argus.db --target /opt/argus/database/identity.db --schema /opt/argus/database/identity-schema.sql; else echo 'No argus.db yet; the gateway creates identity.db at boot.'; fi
    volumes:
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      # The schema SQL ships with the repo, not with every provisioned data
      # dir — bind it into the data-dir path so --schema always resolves.
      - type: bind
        source: ../database/identity-schema.sql
        target: /opt/argus/database/identity-schema.sql
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  # Camera migration init (Ruling AG): opt-in one-shot tool copying the camera
  # tables from argus.db onto the camera.db volume. Idempotent no-op on a
  # schema-current target; run it with the stack stopped so the tool does not
  # race argus-camera on camera.db, and BEFORE the first boot (once
  # argus-camera has applied the camera schema the target is live data and
  # the tool refuses to resurrect argus.db rows over it).
  camera-init:
    profiles: ["camera-init"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ -f /opt/argus/database/argus.db ]; then /opt/argus/argus-migrate-camera --source /opt/argus/database/argus.db --target /opt/argus/camera/camera.db --schema /opt/argus/database/camera-schema.sql; else echo 'No argus.db yet; argus-camera applies the camera schema at boot.'; fi
    volumes:
      - type: bind
        source: ${ARGUS_DATA_DIR:-../database}
        target: /opt/argus/database
        bind:
          create_host_path: false
      # Same repo-shipped schema bind as identity-init: a provisioned data
      # dir without the SQL would fail "schema file not found".
      - type: bind
        source: ../database/camera-schema.sql
        target: /opt/argus/database/camera-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - camera-db:/opt/argus/camera
    restart: "no"

  # RADV validation probe (Fase 2 gate): runs argus-vulkan-probe against the
  # host GPU with /dev/dri mounted. Opt-in because a host without /dev/dri
  # fails the device attach (or drops it with `devices: !override []`, which
  # then exercises the same llvmpipe degradation argus-camera would see).
  # Hosts with restrictive device ACLs may need to add their host
  # video/render group gid via group_add.
  vulkan-probe:
    profiles: ["vulkan-probe"]
    image: argus-cutover:local
    pull_policy: never
    user: "${ARGUS_UID:-1000}:${ARGUS_GID:-1000}"
    network_mode: none
    entrypoint: ["/opt/argus/argus-vulkan-probe"]
    devices:
      - /dev/dri:/dev/dri
    restart: "no"

secrets:
  rustfs_access_key:
    file: ../docker/runtime/secrets/rustfs_access_key
  rustfs_secret_key:
    file: ../docker/runtime/secrets/rustfs_secret_key
  argus_s3_access_key:
    file: ../docker/runtime/secrets/argus_s3_access_key
  argus_s3_secret_key:
    file: ../docker/runtime/secrets/argus_s3_secret_key

volumes:
  rustfs-data:
    name: argus-cutover-rustfs-data
  camera-db:
    name: argus-cutover-camera-db
  camera-stream:
    name: argus-cutover-camera-stream

networks:
  internal:
    name: argus-cutover-internal
