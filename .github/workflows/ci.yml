name: CI

on:
  push:
    branches:
      - main
      - master
      - "migration/**"
  pull_request:

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev pkg-config

      - name: Install clang-tidy
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-tidy-22
          clang-tidy-22 --version

      - name: Install Conan
        run: pip install conan==2.21.0

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.txt') }}

      - name: Detect Conan profile
        run: conan profile detect

      - name: Install the pinned nats-server for the live suites
        run: |
          pin="$GITHUB_WORKSPACE/.github/nats-server.sha256"
          asset="$(awk '{print $2}' "$pin")"
          version="${asset#nats-server-v}"
          version="${version%-linux-amd64.tar.gz}"
          dir="$RUNNER_TEMP/nats-server"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/nats-io/nats-server/releases/download/v$version/$asset"
          (cd "$dir" && sha256sum -c "$pin")
          tar -xzf "$dir/$asset" -C "$dir"
          bin="$dir/${asset%.tar.gz}/nats-server"
          "$bin" --version
          echo "ARGUS_NATS_SERVER_BIN=$bin" >> "$GITHUB_ENV"

      - name: Test build orchestrator
        run: |
          status=0
          ./scripts/build-all-test.sh || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 77 ]; then exit "$status"; fi

      - name: Build and test standalone projects
        run: ./scripts/build-all.sh dev
