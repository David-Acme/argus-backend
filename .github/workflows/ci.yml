name: CI

on:
  push:
    branches:
      - main
      - "migration/**"
  pull_request:

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev pkg-config

      - name: Install Conan
        run: pip install conan==2.21.0

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}

      - name: Detect Conan profile
        run: conan profile detect

      - name: Generate runtime config
        run: cp config.toml.example config.toml

      - name: Install Conan dependencies
        run: conan install . --output-folder=build/dev -s build_type=Debug -s compiler.cppstd=gnu20 --build=missing

      - name: Configure (dev preset)
        run: cmake --preset dev -DARGUS_BUILD_LABS=OFF

      - name: Build (dev preset)
        run: cmake --build --preset dev -j 8

      - name: Unit tests
        working-directory: build/dev
        run: ctest --output-on-failure