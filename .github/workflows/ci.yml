name: CI

on:
  push:
    branches:
      - main
      - master
      - "migration/**"
  pull_request:

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev pkg-config

      # Rules 16 and 19 are checked by ./scripts/build-all.sh at the end of a
      # full run, and the ratchet's counts belong to a clang-tidy major (22, the
      # one scripts/lib/tidy-baseline.txt records): the Ubuntu archive's is 18,
      # so the tool comes from LLVM's own repository.
      - name: Install clang-tidy
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-tidy-22
          clang-tidy-22 --version

      - name: Install Conan
        run: pip install conan==2.21.0

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.txt') }}

      - name: Detect Conan profile
        run: conan profile detect

      - name: Generate runtime configs
        run: |
          for f in services/*/config.toml.example packages/*/config.toml.example; do
            cp "$f" "${f%.example}"
          done

      - name: Test build orchestrator
        run: ./scripts/build-all-test.sh

      - name: Build and test standalone projects
        run: ./scripts/build-all.sh dev
