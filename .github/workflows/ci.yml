name: CI

on:
  push:
    branches:
      - main
      - master
      - "migration/**"
  pull_request:

jobs:
  deps:
    name: Conan dependencies, once
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev pkg-config

      - name: Install Conan
        run: pip install conan==2.21.0

      - name: Restore the Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2-ci
          key: conan-ci-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-conan2.21.0-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-ci-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-conan2.21.0-

      - name: Install the whole Conan graph
        run: |
          set -o pipefail
          ./scripts/build-all.sh ci --install-only 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done

      - name: Trim the Conan cache and check its size
        run: |
          export CONAN_HOME="$HOME/.conan2-ci"
          conan cache clean "*" --source --build --temp
          kb="$(du -sk "$CONAN_HOME" | cut -f1)"
          echo "Conan cache: $((kb / 1024)) MiB"
          if [ "$kb" -gt 10485760 ]; then
            echo "The Conan cache exceeds the 10 GB limit." >&2
            du -sh "$CONAN_HOME"/p/* | sort -rh | head -30
            exit 1
          fi

      - name: Save the Conan cache
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2-ci
          key: conan-ci-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-conan2.21.0-${{ hashFiles('conanfile.txt') }}

  build:
    name: Build ${{ matrix.project }}
    needs: deps
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - cert
          - sqlite
          - auth
          - identity
          - sync
          - camera
          - productivity
          - notification
          - guard
          - settings
          - tts
          - stt
          - vlm
          - llm
          - voice
          - tunnel
    steps:
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev pkg-config

      - name: Install Conan
        run: pip install conan==2.21.0

      - name: Restore the Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2-ci
          key: conan-ci-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-conan2.21.0-${{ hashFiles('conanfile.txt') }}
          fail-on-cache-miss: true

      - name: Install the pinned nats-server for the live suites
        run: |
          pin="$GITHUB_WORKSPACE/.github/nats-server.sha256"
          asset="$(awk '{print $2}' "$pin")"
          version="${asset#nats-server-v}"
          version="${version%-linux-amd64.tar.gz}"
          dir="$RUNNER_TEMP/nats-server"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/nats-io/nats-server/releases/download/v$version/$asset"
          (cd "$dir" && sha256sum -c "$pin")
          tar -xzf "$dir/$asset" -C "$dir"
          bin="$dir/${asset%.tar.gz}/nats-server"
          "$bin" --version
          echo "ARGUS_NATS_SERVER_BIN=$bin" >> "$GITHUB_ENV"

      - name: Build and test ${{ matrix.project }}
        run: ./scripts/build-all.sh ci --only ${{ matrix.project }}

  gates:
    name: Gates and orchestrator test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install the pinned nats-server for the live suites
        run: |
          pin="$GITHUB_WORKSPACE/.github/nats-server.sha256"
          asset="$(awk '{print $2}' "$pin")"
          version="${asset#nats-server-v}"
          version="${version%-linux-amd64.tar.gz}"
          dir="$RUNNER_TEMP/nats-server"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/nats-io/nats-server/releases/download/v$version/$asset"
          (cd "$dir" && sha256sum -c "$pin")
          tar -xzf "$dir/$asset" -C "$dir"
          bin="$dir/${asset%.tar.gz}/nats-server"
          "$bin" --version
          echo "ARGUS_NATS_SERVER_BIN=$bin" >> "$GITHUB_ENV"

      - name: Comments gate
        run: ./scripts/check-comments.sh

      - name: Dependency tiers gate
        run: ./scripts/check-deps.sh

      - name: Route gate
        run: ./scripts/check-routes.sh

      - name: Census gate
        run: python3 scripts/golden-http.py census

      - name: Vendored patches gate
        run: ./scripts/check-vendored.sh

      - name: Test build orchestrator
        run: ./scripts/build-all-test.sh
